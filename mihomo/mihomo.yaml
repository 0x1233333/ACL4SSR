# --- 4. 策略组 (Proxy Groups) ---
proxy-groups:
  # 核心切换
  - name: 🚀 节点选择
    type: select
    proxies: [♻️ 自动选择, 🚀 手动切换, ⚡️ AI纯净优选, 📥 下载专用, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇺🇲 美国节点, DIRECT]
  
  - name: ♻️ 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true

  - name: 🚀 手动切换
    type: select
    include-all: true

  # 应用分流
  - name: 💬 Ai平台
    type: select
    proxies: [⚡️ AI纯净优选, 📥 下载专用, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🚀 手动切换]

  - name: ☁️ 国外云盘
    type: select
    proxies: [📥 下载专用, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇺🇲 美国节点, 🚀 节点选择]

  - name: 🎮 游戏平台
    type: select
    proxies: [DIRECT, 📥 下载专用, 🚀 节点选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点]

  - name: 📹 油管视频
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 📥 下载专用, ⚡️ AI纯净优选, 🇺🇲 美国节点, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇰🇷 韩国节点]
  
  - name: 📲 电报信息
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 📥 下载专用, ⚡️ AI纯净优选, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇺🇲 美国节点]

  - name: 🌍 国外媒体
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 📥 下载专用, ⚡️ AI纯净优选, 🇺🇲 美国节点, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇰🇷 韩国节点]

  - name: 🛑 全球拦截
    type: select
    proxies: [REJECT, DIRECT, 🚀 节点选择]

  # 地区与特殊组 (正则核心)
  - name: ⚡️ AI纯净优选
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    # 已更新正则：选取常用地区，同时排除甲骨文与廉价机房
    filter: "(?i)^(?=.*(us|美|jp|日|kr|韩|sg|新|tw|台|uk|英))(?!.*(oracle|甲骨文|jgw|jparm|cc1|cc2))"
    include-all: true

  - name: 📥 下载专用
    type: select
    filter: "(?i)(s801|wx)"
    include-all: true

  - name: 🇭🇰 香港节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    filter: "(?i)(hk|港)"
    include-all: true

  - name: 🇯🇵 日本节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    filter: "(?i)(jp|日本)"
    include-all: true

  - name: 🇰🇷 韩国节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    filter: "(?i)(kr|韩)"
    include-all: true

  - name: 🇺🇲 美国节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    filter: "(?i)(us|美)"
    include-all: true

  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 📥 下载专用, ⚡️ AI纯净优选, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇺🇲 美国节点, DIRECT]

# --- 5. 规则匹配 (Rules) ---
rules:
  - RULE-SET,ads,🛑 全球拦截

  # 优先级高：特定服务
  - RULE-SET,microsoft,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,ai,💬 Ai平台
  - RULE-SET,pikpak,☁️ 国外云盘
  - RULE-SET,netdisk,☁️ 国外云盘
  - RULE-SET,games,🎮 游戏平台
  - RULE-SET,youtube,📹 油管视频
  - RULE-SET,telegram,📲 电报信息
  - RULE-SET,google,🚀 节点选择
  
  # 地区域名匹配
  - RULE-SET,japan_all,🇯🇵 日本节点
  - RULE-SET,korea_all,🇰🇷 韩国节点
  - RULE-SET,proxy_all,🌍 国外媒体
  
  # 基础直连
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT
  - RULE-SET,cn,DIRECT
  - RULE-SET,cn_ip,DIRECT

  - MATCH,🐟 漏网之鱼
