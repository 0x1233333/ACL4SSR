  cn_ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"
    path: ./ruleset/cn_ip.mrs
    interval: 86400

# --- 3. 策略组 (Proxy Groups) ---
proxy-groups:
  
  # === 第一梯队：核心/模式 ===
  - name: 🚀 节点选择
    type: select
    # 包含了下面所有的特殊组和地区组
    proxies: [♻️ 自动选择, 🚀 手动切换, ⚡️ AI纯净优选, 📥 下载专用, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇺🇲 美国节点, DIRECT]
  
  - name: ♻️ 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true

  - name: 🚀 手动切换
    type: select
    include-all: true

  # === 第二梯队：功能应用 ===
  - name: 💬 Ai平台
    type: select
    # 优先使用纯净组，其次下载组(大带宽备用)，再是地区
    proxies: [⚡️ AI纯净优选, 📥 下载专用, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🚀 手动切换]

  - name: ☁️ 国外云盘
    type: select
    proxies: [📥 下载专用, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇺🇲 美国节点, 🚀 节点选择]

  - name: 🎮 游戏平台
    type: select
    proxies: [DIRECT, 📥 下载专用, 🚀 节点选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点]

  - name: 📹 油管视频
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 📥 下载专用, ⚡️ AI纯净优选, 🇺🇲 美国节点, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇰🇷 韩国节点]

  - name: 🎬 日韩地区
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 📥 下载专用, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇭🇰 香港节点, DIRECT]
  
  - name: 📲 电报信息
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 📥 下载专用, ⚡️ AI纯净优选, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇺🇲 美国节点]

  - name: Ⓜ️ 微软服务
    type: select
    proxies: [DIRECT, 📥 下载专用, 🚀 节点选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点]

  - name: 🍎 苹果服务
    type: select
    proxies: [DIRECT, 📥 下载专用, 🚀 节点选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点]

  - name: 🌍 国外媒体
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 📥 下载专用, ⚡️ AI纯净优选, 🇺🇲 美国节点, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇰🇷 韩国节点]

  - name: 🛑 全球拦截
    type: select
    # 调试模式：方便误杀时切换
    proxies: [REJECT, DIRECT, 🚀 节点选择]

  # === 第三梯队：地区节点/特殊 ===
  
  # 1. AI 纯净优选 (防污染核心)
  - name: ⚡️ AI纯净优选
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    # 逻辑：强力正则，只选美/日/新/台/英，且排除甲骨文及廉价机房
    filter: "(?i)^(?=.*(us|美|jp|日|kr|韩|sg|新|tw|台|uk|英))(?!.*(oracle|甲骨文|jgw|jparm|cc1|cc2))"
    include-all: true

  # 2. 下载专用 (s801/wx)
  - name: 📥 下载专用
    type: select
    filter: "(?i)(s801|wx)"
    include-all: true

  # 3. 地区节点 (甲骨文已包含在内)
  - name: 🇭🇰 香港节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    filter: "(?i)(hk|港)"
    include-all: true

  - name: 🇯🇵 日本节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    # 包含所有 日本/JP 节点 (含甲骨文)
    filter: "(?i)(jp|日本)"
    include-all: true

  - name: 🇰🇷 韩国节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    # 包含所有 韩国/KR 节点 (含甲骨文)
    filter: "(?i)(kr|韩)"
    include-all: true

  - name: 🇺🇲 美国节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    # 包含所有 美国/US 节点
    filter: "(?i)(us|美)"
    include-all: true

  # === 兜底辅助 (Hidden) ===
  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 📥 下载专用, ⚡️ AI纯净优选, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇺🇲 美国节点, DIRECT]

  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT]

# --- 4. 规则匹配 (Rules) ---
rules:
  - RULE-SET,ads,🛑 全球拦截

  # === 优先级 1: 微软/苹果 (避免进入云盘组) ===
  - RULE-SET,microsoft,Ⓜ️ 微软服务
  - RULE-SET,apple,🍎 苹果服务

  # === 优先级 2: 功能应用 ===
  - RULE-SET,ai,💬 Ai平台
  - RULE-SET,pikpak,☁️ 国外云盘
  - RULE-SET,netdisk,☁️ 国外云盘
  - RULE-SET,games,🎮 游戏平台
  - RULE-SET,youtube,📹 油管视频
  - RULE-SET,telegram,📲 电报信息

  # === 优先级 3: 地区/大厂 ===
  - RULE-SET,google,🚀 节点选择
  # 日韩全量域名 -> 强制走日韩应用组
  - RULE-SET,japan_all,🎬 日韩地区
  - RULE-SET,korea_all,🎬 日韩地区

  # === 优先级 4: 兜底逻辑 ===
  - RULE-SET,proxy_all,🌍 国外媒体
  
  # 国内直连
  - GEOSITE,private,🎯 全球直连
  - GEOIP,private,🎯 全球直连
  - RULE-SET,cn,🎯 全球直连
  - RULE-SET,cn_ip,🎯 全球直连

  - MATCH,🐟 漏网之鱼
