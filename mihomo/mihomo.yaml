# === Mihomo (Clash Meta) 终极配置文件 ===
# 适用内核: Mihomo (Clash Meta)
# 布局逻辑: 核心设置 -> 规则集 -> 策略组 -> 匹配规则
# 包含特性: .mrs 二进制规则支持 | 甲骨文分流 | AI 防污染正则

# --- 1. 基础设置 ---
port: 7890
socks-port: 7891
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
external-controller: 0.0.0.0:9090
keep-alive-interval: 15
unified-delay: true
tcp-concurrent: true

# 流量嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]

# DNS 设置
dns:
  enable: true
  listen: :1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ["*", "+.lan", "+.local"]
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr: [240.0.0.0/4]

# --- 2. 节点占位 (转换器会自动填充此部分) ---
proxies: []
proxy-providers: {}

# --- 3. 分流规则集 (Rule Providers) ---
rule-providers:
  ads:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"
    path: ./ruleset/ads.mrs
    interval: 86400

  ai:
