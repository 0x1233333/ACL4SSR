; ==============================================
; 2. 策略组配置 (Proxy Groups)
; ==============================================

; --- 核心选择组 ---
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🐢 慢速节点`[]📥 下载节点`[]🚀 手动切换`[]DIRECT

; 🚨 自动选择去毒：强制排除慢速、甲骨文、香港节点
custom_proxy_group=♻️ 自动选择`url-test`(?i)^(?!.*(jgw|Oracle|甲骨文|官网|剩余|到期|hk|港|hongkong)).*`http://cp.cloudflare.com/generate_204`300,,50

; --- 🚫 广告拦截 (REJECT 第一) ---
custom_proxy_group=🚫 广告拦截`select`[]REJECT`[]🚀 节点选择`[]DIRECT

; --- 💬 Ai平台 (主动去毒：无慢速、香港、直连、下载) ---
custom_proxy_group=💬 Ai平台`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点

; --- ☁️ PikPak (ROI 优化) ---
custom_proxy_group=☁️ PikPak`select`[]📥 下载节点`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择`[]🐢 慢速节点

; --- 🪙 虚拟货币 (严格物理隔离：锁定离岸，绝不允许国内或香港节点) ---
custom_proxy_group=🪙 虚拟货币`select`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点

; --- 🔞 成人内容 (隐私组：无 DIRECT) ---
custom_proxy_group=🔞 成人内容`select`[]🇯🇵 日本节点`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 节点选择`[]📥 下载节点`[]🐢 慢速节点

; --- 📲 视频与社交 (含慢速/直连兜底) ---
custom_proxy_group=📲 电报消息`select`[]♻️ 自动选择`[]🚀 节点选择`[]📥 下载节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]🐢 慢速节点`[]DIRECT
custom_proxy_group=📹 油管视频`select`[]♻️ 自动选择`[]🚀 节点选择`[]📥 下载节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]🐢 慢速节点`[]DIRECT
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]📥 下载节点`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]🐢 慢速节点`[]DIRECT

; --- 📺 哔哩哔哩 ---
custom_proxy_group=📺 哔哩哔哩`select`[]🎯 全球直连`[]🇭🇰 香港节点`[]📥 下载节点

; --- 📢 谷歌FCM (主动去毒：移除下载节点，保障长连接保活) ---
custom_proxy_group=📢 谷歌FCM`select`[]♻️ 自动选择`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点

; --- Ⓜ️ 微软Bing (主动去毒：剔除下载节点防验证码阻断) ---
custom_proxy_group=Ⓜ️ 微软Bing`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点

; --- Ⓜ️ 微软/🍎 苹果 (直连第一) ---
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]📥 下载节点`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🐢 慢速节点
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]📥 下载节点`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🐢 慢速节点
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`[]📥 下载节点`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🐢 慢速节点

; --- 系统隔离 ---
custom_proxy_group=🎯 全球直连`select`[]DIRECT

; --- 🚨 漏网之鱼 (彻底修复侧信道漏洞：采用纯净自动组兜底) ---
custom_proxy_group=🐟 漏网之鱼`fallback`[]♻️ 自动选择`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`http://cp.cloudflare.com/generate_204`300

; === 地区/功能/地区组 (正则维护) ===
custom_proxy_group=📥 下载节点`select`(?i)(wx|s801)
custom_proxy_group=🇭🇰 香港节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(hk|港|hongkong)
custom_proxy_group=🇯🇵 日本节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(jp|日本|jparm|tokyo)
custom_proxy_group=🇰🇷 韩国节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(kr|韩|seoul)

; 🚨 强制修复：重新写入高危 IDC 标签过滤阻断模型
custom_proxy_group=🇺🇲 美国节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文|c93s4|hosting|center|vps|机房)).*(us|美|c93s|unitedstates)

; --- 慢速与手动组 ---
custom_proxy_group=🐢 慢速节点`select`(?i)(jgw|Oracle|甲骨文)
custom_proxy_group=🚀 手动切换`select`.*

enable_rule_generator=true
overwrite_original_rules=true
