; ==============================================================
; SubConverter-Extended 2026 定制终极版 (全量 GEOSITE 重构版)
; 
; 【架构重构与修复清单】
; 1. 全量迁移：放弃远端 List 拉取，全部改写为 Meta 内核专属 GEOSITE 语法。
; 2. 隐私阻断：电报与国外媒体已彻底移除 [🚀 节点选择] 嵌套，强制隔离直连风险。
; 3. 性能优化：0 外部链接请求，内存占用预计降低 80% 以上。
; ==============================================================

[common]
enable_rule_generator=true
overwrite_original_rules=true

[custom]
; ==============================================================
; 1. 路由规则定义区 (Ruleset) - 全量 GEOSITE
; ==============================================================
; 🔴【Priority 1：强制拦截】
ruleset=🚫 广告拦截,[]GEOSITE,category-ads-all

; 🔴【Priority 2：全球直连】
ruleset=🎯 全球直连,[]GEOSITE,cn

; --- 💰 加密货币 (防风控隔离：仅限虚拟货币相关) ---
ruleset=💰 加密货币,[]GEOSITE,cryptocurrency
ruleset=💰 加密货币,[]GEOSITE,binance
ruleset=💰 加密货币,[]GEOSITE,okx
ruleset=💰 加密货币,[]GEOSITE,bybit
ruleset=💰 加密货币,[]GEOSITE,huobi
ruleset=💰 加密货币,[]GEOSITE,kucoin

; --- 💬 AI 平台 (LLM 与多模态) ---
ruleset=💬 Ai平台,[]GEOSITE,openai
ruleset=💬 Ai平台,[]GEOSITE,gemini
ruleset=💬 Ai平台,[]GEOSITE,anthropic
ruleset=💬 Ai平台,[]GEOSITE,github
ruleset=💬 Ai平台,[]GEOSITE,bing

; --- 🔞 成人内容 ---
ruleset=🔞 成人内容,[]GEOSITE,category-porn

; --- 基础设施与泛媒体 ---
ruleset=📲 电报消息,[]GEOSITE,telegram
ruleset=🚀 节点选择,[]GEOSITE,twitter
ruleset=📢 谷歌FCM,[]GEOSITE,google-fcm
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=Ⓜ️ 微软Bing,[]GEOSITE,bing
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=🍎 苹果服务,[]GEOSITE,apple-cn
ruleset=☁️ PikPak,[]GEOSITE,pikpak
ruleset=📹 油管视频,[]GEOSITE,youtube
ruleset=📺 哔哩哔哩,[]GEOSITE,bilibili
ruleset=🌍 国外媒体,[]GEOSITE,category-media
ruleset=🌍 国外媒体,[]GEOSITE,category-entertainment
ruleset=🎮 游戏平台,[]GEOSITE,category-games

; --- 兜底 ---
; 针对 PT/BT 下载行为进行阻断或分流
ruleset=📥 下载节点,[]GEOSITE,category-pt
ruleset=📥 下载节点,[]GEOSITE,category-bt
ruleset=📥 下载节点,[]GEOSITE,xunlei
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ==============================================================
; 2. 策略组定义区 (Proxy Groups)
; ==============================================================

; 🚀 核心选择组 (主入口)
; 次末位排布：慢速节点置于倒数第二位（DIRECT之前）
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]⚖️ 负载均衡`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]📥 下载节点`[]🚀 手动切换`[]🐢 慢速节点`[]DIRECT

; ♻️ 自动选择 & ⚖️ 负载均衡
custom_proxy_group=♻️ 自动选择`url-test`(?i)^(?!.*(jgw|Oracle|甲骨文|官网|剩余|到期|hk|港|hongkong)).*`http://cp.cloudflare.com/generate_204`600,,50
custom_proxy_group=⚖️ 负载均衡`fallback`(?i)^(?!.*(jgw|Oracle|甲骨文|hk|港|hongkong)).*`http://cp.cloudflare.com/generate_204`600

; --- 💰 加密货币 ---
custom_proxy_group=💰 加密货币`select`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🚀 手动切换

; --- 💬 AI 平台 ---
custom_proxy_group=💬 Ai平台`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点

; --- 🔞 成人内容 ---
custom_proxy_group=🔞 成人内容`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🚀 节点选择

; --- 应用分组 ---
custom_proxy_group=🐟 漏网之鱼`select`[]⚖️ 负载均衡`[]♻️ 自动选择`[]🇯🇵 日本节点`[]🇰🇷 韩国节点
custom_proxy_group=☁️ PikPak`select`[]📥 下载节点`[]🚀 节点选择`[]🎯 全球直连
custom_proxy_group=📺 哔哩哔哩`select`[]🎯 全球直连`[]🇭🇰 香港节点`[]📥 下载节点

; 油管：加入下载节点，慢速节点兜底
custom_proxy_group=📹 油管视频`select`[]♻️ 自动选择`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]📥 下载节点`[]🐢 慢速节点

; 电报：已物理切断 [🚀 节点选择] 嵌套，彻底阻断直连侧漏风险。慢速节点兜底。
custom_proxy_group=📲 电报消息`select`[]♻️ 自动选择`[]📥 下载节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]🐢 慢速节点

; 国外媒体：已物理切断 [🚀 节点选择] 嵌套，彻底阻断直连侧漏风险。慢速节点兜底。
custom_proxy_group=🌍 国外媒体`select`[]♻️ 自动选择`[]📥 下载节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]🐢 慢速节点

; 游戏平台：加入下载节点，慢速节点兜底
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 节点选择`[]📥 下载节点`[]🐢 慢速节点

; --- 基础设施 ---
custom_proxy_group=📢 谷歌FCM`select`[]♻️ 自动选择`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 微软Bing`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点

; 微软与苹果服务脱钩，防止互相嵌套死循环
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🚀 节点选择
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🚀 节点选择

; --- 拦截与直连 ---
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🚫 广告拦截`select`[]REJECT`[]DIRECT

; ==============================================================
; 3. 正则筛选器 (地区组)
; ==============================================================
custom_proxy_group=📥 下载节点`select`(?i)(wx|s801)
custom_proxy_group=🇭🇰 香港节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(hk|港|hongkong)
custom_proxy_group=🇯🇵 日本节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(jp|日本|tokyo|c93s4)
custom_proxy_group=🇰🇷 韩国节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(kr|韩|seoul)
custom_proxy_group=🇺🇲 美国节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文|c93s4|s801)).*(us|美|unitedstates|c93s|\.top-(?:VLESS_Reality_Vision|singbox_naive|anytls))
custom_proxy_group=🐢 慢速节点`select`(?i)(jgw|Oracle|甲骨文)
custom_proxy_group=🚀 手动切换`select`.*
