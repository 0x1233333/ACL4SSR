; === ACL4SSR 深度定制版 (Mihomo/Clash Meta) - Pixel 1 & Gemini 最终修复版 ===
; 核心逻辑：标准 DNS 兼容模式 + 屏蔽 IPv6 + 强制锁定 Gemini 美国/日本节点

; --- 全局设置 ---
ipv6: false
allow-lan: true
mixed-port: 7890
unified-delay: true
tcp-concurrent: true
external-controller: 0.0.0.0:9090

; --- DNS 专项配置 (兼容传统解析，防止 Pixel 1 泄漏) ---
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - 8.8.8.8               # 传统 UDP 协议，兼容性最好
    - 1.1.1.1
    - tcp://8.8.4.4         # TCP 协议兜底，防止 UDP 干扰
    - tcp://208.67.222.222
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

; --- 顶部规则 (优先级最高) ---
; 1. 强力拦截 IPv6 流量，防止 Android 隧道泄漏位置
custom_rule_top=IP-CIDR6,::/0,REJECT

; 2. 屏蔽所有 Google/YouTube 的 QUIC (UDP 443)，强制回退到代理 TCP
custom_rule_top=AND,((DOMAIN-KEYWORD,google),(NETWORK,UDP),(DST-PORT,443)),REJECT
custom_rule_top=AND,((DOMAIN-KEYWORD,youtube),(NETWORK,UDP),(DST-PORT,443)),REJECT

; 3. Gemini 核心域名强制分流 (解决 Pixel App 报错)
custom_rule_top=DOMAIN-KEYWORD,gemini,💬 Ai平台
custom_rule_top=DOMAIN-KEYWORD,generativelanguage,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,bard.google.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,proactive-assistant.googleapis.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,assistant-pa.googleapis.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,google.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,googleapis.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,gstatic.com,💬 Ai平台

; 4. Pixel 系统连通性检查 (防止 WiFi 图标显示感叹号)
custom_rule_top=DOMAIN,connectivitycheck.gstatic.com,🚀 节点选择
custom_rule_top=DOMAIN,connectivitycheck.android.com,🚀 节点选择

; --- 规则集引用 ---
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=💰 加密货币,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Crypto/Crypto.list
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🎬 日韩媒体,https://raw.githubusercontent.com/Meilieage/webcdn/main/rule/list/RiHanMeiTi.list
ruleset=🐝 PikPak,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PikPak/PikPak.list
ruleset=🎮 Steam,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.yaml
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=🎯 全球直连,[]GEOIP,CN

; ====== 1. 核心策略组 ======
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🌀 其他未知`[]🚀 手动切换`[]DIRECT

custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,150

custom_proxy_group=🚀 手动切换`select`.*

; ====== 2. 地区策略组 ======
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)^(?=.*(hk|港))(?!.*(oracle|甲骨文|jgw|jparm|cc1|cc2))`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)^(?=.*(jp|日本|c93s4))(?!.*(oracle|甲骨文|jgw|jparm|cc1|cc2))`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇺🇲 美国节点`url-test`(?i)^(?=.*(us|美|c93s1|c93s2|c93s3|c93s5|c93s801|VLESS_TCP\/TLS_Vision|vless_reality_vision))(?!.*(oracle|甲骨文|jgw|nomao|c93s4|hk|港|jp|日本|kr|韩))`http://www.gstatic.com/generate_204`300,,200
custom_proxy_group=🇰🇷 韩国节点`url-test`(?i)^(?=.*(kr|韩))(?!.*(oracle|甲骨文|jgw|cc1|cc2))`http://www.gstatic.com/generate_204`300,,200
custom_proxy_group=🐢 甲骨文组`url-test`(?i)oracle|甲骨文|jgw|jparm|cc1|cc2`http://www.gstatic.com/generate_204`300,,200
custom_proxy_group=🌀 其他未知`url-test`(?i)^(?!.*(hk|港|jp|日本|us|美|kr|韩|oracle|甲骨文|jgw|jparm|cc1|cc2|c93s|VLESS_TCP\/TLS_Vision|vless_reality_vision)).*|nomao`http://www.gstatic.com/generate_204`300,,200

