  - +.in-addr.arpa
  - +.ip6.arpa
  - routerlogin.net
  - routerlogin.com
  - +.routerlogin.net
  - +.routerlogin.com
  - connectivitycheck.gstatic.com
  - clients3.google.com
  - time.cloudflare.com
  - time.google.com
  - time.windows.com
  - +.ntp.org
  - +.pool.ntp.org
  - +.ipv6-literal.net
  - +.test-ipv6.com
  - test-ipv6.com
  - +.ipv6-test.com
  - ipv6-test.com
  - +.speedtest.net
  - +.ooklaserver.net
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 2400:3200::1
  - 2402:4e:1111::8888
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  - 223.5.5.5
  - 119.29.29.29
  - 2400:3200::1
  - 2402:4e:1111::8888
