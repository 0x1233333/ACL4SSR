; === 地区策略组 (基于最新正则与 HTTPS 测速) ===
; 注意：以下所有地区分组均已添加排除 (?!.*(回家|home|cn))，确保回家节点不会被自动优选选中

; ⚡️ AI纯净优选 (严格排除甲骨文/CC/下载节点/回家节点)
custom_proxy_group=⚡️ AI纯净优选`url-test`(?i)^(?=.*(us|美|jp|日|kr|韩|sg|新|tw|台))(?!.*(oracle|甲骨文|jgw|jparm|cc1|cc2|wx|s801|回家|home|cn))`https://www.gstatic.com/generate_204`300,,150

; 📥 下载节点 (提取 wx 和 s801，排除回家节点)
custom_proxy_group=📥 下载节点`url-test`(?i)(wx|s801)(?!.*(回家|home|cn))`https://www.gstatic.com/generate_204`300,,150

; 🇭🇰 香港 (排除回家节点)
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)(hk|港)(?!.*(回家|home|cn))`https://www.gstatic.com/generate_204`300,,150

; 🇯🇵 日本 (含甲骨文 jp-Oracle，排除回家节点)
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)(jp|日本|jparm|c93s4)(?!.*(回家|home|cn))`https://www.gstatic.com/generate_204`300,,150

; 🇰🇷 韩国 (含甲骨文 kr-Oracle，排除回家节点)
custom_proxy_group=🇰🇷 韩国节点`url-test`(?i)(kr|韩)(?!.*(回家|home|cn))`https://www.gstatic.com/generate_204`300,,150

; 🇺🇲 美国 (通用美国组，排除回家节点)
custom_proxy_group=🇺🇲 美国节点`url-test`(?i)(us|美|c93s)(?!.*(回家|home|cn))`https://www.gstatic.com/generate_204`300,,200

enable_rule_generator=true
overwrite_original_rules=true
