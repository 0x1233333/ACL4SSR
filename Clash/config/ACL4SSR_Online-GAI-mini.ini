custom_proxy_group=💰 加密货币`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🐢 甲骨文组`[]🌀 其他未知`[]DIRECT

