; --- 分组策略部分 (Proxy Group) ---

; 1. 核心总选择组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🌀 其他未知`[]🚀 手动切换`[]DIRECT`[]⛓️ 媒体完全自定义中转

; 2. 自动测速组
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,150

; 3. 手动切换
custom_proxy_group=🚀 手动切换`select`.*

; ====== 中转链核心逻辑 (不改代码的终极方案) ======
; 定义前置(入口)
custom_proxy_group=🅰️ 手选前置(入口)`select`[]DIRECT`.*
; 定义后置(出口)，末尾的 8 个反引号用于在第 9 位注入 dialer-proxy
custom_proxy_group=🅱️ 手选后置(出口)`select`[]DIRECT`.*```````🅰️ 手选前置(入口)
; 定义引用名
custom_proxy_group=⛓️ 媒体完全自定义中转`select`[]🅱️ 手选后置(出口)

