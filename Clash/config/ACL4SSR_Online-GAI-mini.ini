; ==============================================
; 策略组配置 (Proxy Groups)
; ==============================================

; 核心分组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]📥 下载专用`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🚀 手动切换`select`.*
; 下载专用 (包含所有节点)
custom_proxy_group=📥 下载专用`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300

; === 应用分组 ===
custom_proxy_group=💬 Ai平台`select`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]♻️ 自动选择`[]🚀 手动切换
