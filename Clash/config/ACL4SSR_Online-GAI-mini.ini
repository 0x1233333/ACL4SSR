; ==============================================================
; SubConverter-Extended 2026 定制终极版 (List 方案 - 逻辑纠错)
; 
; 【修复清单】
; 1. 微软服务嵌套苹果服务的逻辑错误 -> 已解除相互嵌套，改为独立的国家/节点回退。
; 2. 补全下载节点 -> 在 [📹 油管视频] 和 [🎮 游戏平台] 中加入了 [📥 下载节点]。
; 3. 废物利用慢速节点 -> 在 [📹 油管视频]、[📲 电报消息]、[🌍 国外媒体]、[🎮 游戏平台] 末尾追加了 [🐢 慢速节点] 作为兜底。
; 4. 核心组次末位排布 -> 在 [🚀 节点选择] 的倒数第二位放置了 [🐢 慢速节点]（位于 DIRECT 之前）。
; 5. 阻断隐私侧漏 -> 彻底移除了 [📲 电报消息] 和 [🌍 国外媒体] 中的 DIRECT 直连选项。
; ==============================================================

[common]
enable_rule_generator=true
overwrite_original_rules=true

[custom]
; ==============================================================
; 1. 路由规则定义区 (Ruleset)
; ==============================================================
; 🔴【Priority 1：强制拦截】
ruleset=🚫 广告拦截,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.list

; 🔴【Priority 2：全球直连】
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list

; --- 💰 加密货币 (防风控隔离：仅限虚拟货币相关，排除支付平台) ---
ruleset=💰 加密货币,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Cryptocurrency/Cryptocurrency.list
ruleset=💰 加密货币,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Crypto/Crypto.list
ruleset=💰 加密货币,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Binance/Binance.list
ruleset=💰 加密货币,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OKX/OKX.list

; --- 💬 AI 平台 (剔除失效项，补充 Anthropic) ---
ruleset=💬 Ai平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=💬 Ai平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=💬 Ai平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=💬 Ai平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Anthropic/Anthropic.list
ruleset=💬 Ai平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.list

; --- 🔞 成人内容 ---
ruleset=🔞 成人内容,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-porn.list

; --- 基础设施与泛媒体 ---
ruleset=📲 电报消息,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.list
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GoogleFCM/GoogleFCM.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list
ruleset=Ⓜ️ 微软Bing,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Bing/Bing.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list
ruleset=☁️ PikPak,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PikPak/PikPak.list
ruleset=📹 油管视频,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=📺 哔哩哔哩,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/BiliBili/BiliBili.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/Game.list

; --- 兜底 ---
ruleset=📥 下载节点,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Download/Download.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ==============================================================
; 2. 策略组定义区 (Proxy Groups)
; ==============================================================

; 🚀 核心选择组 (主入口)
; 慢速节点置于倒数第二位（DIRECT之前）
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]⚖️ 负载均衡`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]📥 下载节点`[]🚀 手动切换`[]🐢 慢速节点`[]DIRECT

; ♻️ 自动选择 & ⚖️ 负载均衡
custom_proxy_group=♻️ 自动选择`url-test`(?i)^(?!.*(jgw|Oracle|甲骨文|官网|剩余|到期|hk|港|hongkong)).*`http://cp.cloudflare.com/generate_204`600,,50
custom_proxy_group=⚖️ 负载均衡`fallback`(?i)^(?!.*(jgw|Oracle|甲骨文|hk|港|hongkong)).*`http://cp.cloudflare.com/generate_204`600

; --- 💰 加密货币 ---
custom_proxy_group=💰 加密货币`select`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🚀 手动切换

; --- 💬 AI 平台 ---
custom_proxy_group=💬 Ai平台`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🐢 慢速节点

; --- 🔞 成人内容 ---
custom_proxy_group=🔞 成人内容`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🚀 节点选择`[]🐢 慢速节点

; --- 应用分组 ---
custom_proxy_group=🐟 漏网之鱼`select`[]⚖️ 负载均衡`[]♻️ 自动选择`[]🇯🇵 日本节点`[]🇰🇷 韩国节点
custom_proxy_group=☁️ PikPak`select`[]📥 下载节点`[]🚀 节点选择`[]🐢 慢速节点
custom_proxy_group=📺 哔哩哔哩`select`[]🎯 全球直连`[]🇭🇰 香港节点`[]📥 下载节点

; 油管：加入下载节点，慢速节点兜底
custom_proxy_group=📹 油管视频`select`[]♻️ 自动选择`[]🚀 节点选择`[]🇯🇵 日本节点`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]📥 下载节点`[]🐢 慢速节点

; 电报：剔除直连，慢速节点兜底
custom_proxy_group=📲 电报消息`select`[]♻️ 自动选择`[]🚀 节点选择`[]📥 下载节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]🐢 慢速节点

; 国外媒体：剔除直连，慢速节点兜底
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]📥 下载节点`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]🐢 慢速节点

; 游戏平台：加入下载节点，慢速节点兜底
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 节点选择`[]📥 下载节点`[]🐢 慢速节点

; --- 基础设施 ---
custom_proxy_group=📢 谷歌FCM`select`[]♻️ 自动选择`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 微软Bing`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点

; 微软与苹果服务脱钩，防止互相嵌套死循环
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🚀 节点选择
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🚀 节点选择

; --- 拦截与直连 ---
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🚫 广告拦截`select`[]REJECT`[]DIRECT

; ==============================================================
; 3. 正则筛选器 (地区组)
; ==============================================================
custom_proxy_group=📥 下载节点`select`(?i)(wx|s801)
custom_proxy_group=🇭🇰 香港节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(hk|港|hongkong)
custom_proxy_group=🇯🇵 日本节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(jp|日本|tokyo|c93s4)
custom_proxy_group=🇰🇷 韩国节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(kr|韩|seoul)
custom_proxy_group=🇺🇲 美国节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文|c93s4|s801)).*(us|美|unitedstates|c93s|\.top-(?:VLESS_Reality_Vision|singbox_naive|anytls))
custom_proxy_group=🐢 慢速节点`select`(?i)(jgw|Oracle|甲骨文)
custom_proxy_group=🚀 手动切换`select`.*
