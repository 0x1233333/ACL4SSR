; === ACL4SSR 深度定制优化版 (Mihomo/Clash Meta) ===
; 更新时间：2026-01-24
; 核心改动：
; 1. DNS 增加 UDP 223.5.5.5 防止 DoH 解析死循环。
; 2. 测速全部强制 HTTPS，剔除握手超时但 ping 低的“假快”节点（针对甲骨文）。
; 3. 解散“甲骨文组”，将其归入各国家分组。
; 4. 新增“AI 纯净优选”组，专门为 ChatGPT 剔除甲骨文节点。

; --- 1. 全局设置 ---
custom_config=allow-lan`true
custom_config=mixed-port`7890
custom_config=unified-delay`true
custom_config=tcp-concurrent`true
custom_config=external-controller`0.0.0.0:9090
custom_config=ipv6`false
; 禁用 IPv6 可以解决很多奇怪的连接等待问题

; --- 2. 核心嗅探 ---
custom_config=sniffer.enable`true
custom_config=sniffer.sniff.TLS.ports`[443, 8443]
custom_config=sniffer.sniff.HTTP.ports`[80, 8080-8880]
custom_config=sniffer.sniff.HTTP.override-destination`true
custom_config=sniffer.force-domain`["+"]

; --- 3. DNS 配置 (修复版) ---
custom_config=dns.enable`true
custom_config=dns.ipv6`false
custom_config=dns.enhanced-mode`fake-ip
custom_config=dns.fake-ip-range`198.18.0.1/16
custom_config=dns.listen`:1053
custom_config=dns.use-hosts`true
; 加入 223.5.5.5 (UDP) 确保能解析 DoH 域名，防止死循环
custom_config=dns.nameserver`["223.5.5.5", "https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]
custom_config=dns.fallback`["https://dns.google/dns-query", "https://1.1.1.1/dns-query", "tls://8.8.4.4"]
custom_config=dns.fallback-filter.geoip`true
custom_config=dns.fallback-filter.geoip-code`CN
custom_config=dns.fallback-filter.ipcidr`["240.0.0.0/4", "0.0.0.0/32"]

; --- 4. 强制修正规则 (Top) ---
; 屏蔽 QUIC (UDP 443) 迫使 Google/YouTube 走 TCP，提高代理稳定性
custom_rule_top=AND,((DOMAIN-KEYWORD,google),(NETWORK,UDP),(DST-PORT,443)),REJECT
custom_rule_top=AND,((DOMAIN-KEYWORD,youtube),(NETWORK,UDP),(DST-PORT,443)),REJECT
; 解决特定论坛访问问题
custom_rule_top=DOMAIN-SUFFIX,nodeseek.com,🚀 节点选择
custom_rule_top=DOMAIN-SUFFIX,linux.do,🚀 节点选择
custom_rule_top=DOMAIN-SUFFIX,v2ex.com,🚀 节点选择

; --- 5. 规则集引用 ---
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=📺 哔哩哔哩,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Bilibili.list
ruleset=💰 加密货币,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Crypto/Crypto.list
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🎬 日韩媒体,https://raw.githubusercontent.com/Meilieage/webcdn/main/rule/list/RiHanMeiTi.list
ruleset=🐝 PikPak,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PikPak/PikPak.list
ruleset=🎮 Steam,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.yaml
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,[]GEOIP,CN

; ====== 6. 核心策略组 ======
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点`[]🚀 手动切换`[]DIRECT

; [HTTPS 测速] 这里的 URL 改为了 https，能剔除只有 TCP 连通但实际无法握手的垃圾节点
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,150

custom_proxy_group=🚀 手动切换`select`.*

; ====== 7. 地区策略组 (包含甲骨文) ======
; 正则说明：保留了 c93s 等特殊关键词，去掉了排除甲骨文的逻辑
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)^(?=.*(hk|港))(?!.*(深港|沪港))`https://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)^(?=.*(jp|日本|c93s4))`https://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇺🇲 美国节点`url-test`(?i)^(?=.*(us|美|c93s1|c93s2|c93s3|c93s5|c93s801|VLESS_TCP\/TLS_Vision|vless_reality_vision))`https://www.gstatic.com/generate_204`300,,200
custom_proxy_group=🇰🇷 韩国节点`url-test`(?i)^(?=.*(kr|韩))`https://www.gstatic.com/generate_204`300,,200

; ====== 8. AI 专用优化组 (重点) ======
; 逻辑：选取 美/日/韩/新/台 节点，但用正则强制剔除 Oracle/甲骨文/JGW 等数据中心节点
; 目的：让 ChatGPT 走纯净 IP，避免 Access Denied，同时利用 HTTPS 测速选最快的
custom_proxy_group=⚡️ AI纯净优选`url-test`(?i)^(?=.*(us|美|jp|日|kr|韩|sg|新|tw|台))(?!.*(oracle|甲骨文|jgw|jparm|cc1|cc2))`https://www.gstatic.com/generate_204`300,,150

; ====== 9. 应用分流组 ======
; AI 平台首选上面的“纯净优选”组
custom_proxy_group=💬 Ai平台`select`[]⚡️ AI纯净优选`[]🚀 手动切换`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 节点选择

; 媒体和其他服务可以用普通国家组（包含甲骨文，带宽大适合看视频）
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点`[]DIRECT
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点`[]DIRECT
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点
custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点`[]DIRECT
custom_proxy_group=💰 加密货币`select`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]DIRECT
custom_proxy_group=🐝 PikPak`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点`[]DIRECT
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点
