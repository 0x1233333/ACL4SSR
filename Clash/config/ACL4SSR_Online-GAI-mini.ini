[common]
; 通用设置
api_mode=true
exclude_remarks=(到期|剩余|官网|过期|流量|测试|账户|重置|回国|Game|游戏|网址|牌)
enable_rule_generator=true
overwrite_original_rules=true

; ==============================================
; 策略组配置 (Proxy Groups)
; ==============================================
[proxy_group]

; === 1. 底层地区/功能节点筛选 ===

; ⚡️ AI纯净优选 (修复参数: 300)
custom_proxy_group=⚡️ AI纯净优选`url-test`(?i)^(?=.*(us|美|jp|日|kr|韩|sg|新|tw|台|uk|英))(?!.*(oracle|甲骨文|jgw|jparm|cc1|cc2|vultr|racknerd|cloudcone|rn|bwg))`https://www.gstatic.com/generate_204`300

; 地区节点 (修复参数: 300)
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)(hk|港)`https://www.gstatic.com/generate_204`300
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)(jp|日本)`https://www.gstatic.com/generate_204`300
custom_proxy_group=🇰🇷 韩国节点`url-test`(?i)(kr|韩)`https://www.gstatic.com/generate_204`300
custom_proxy_group=🇺🇲 美国节点`url-test`(?i)(us|美)`https://www.gstatic.com/generate_204`300
custom_proxy_group=🇸🇬 新加坡节点`url-test`(?i)(sg|新)`https://www.gstatic.com/generate_204`300

; 📥 下载专用 (修复正则: 移除危险的 x，改为匹配倍率 x\d)
custom_proxy_group=📥 下载专用`select`(?i)(s801|wx|倍|x\d)

; ♻️ 自动选择 & 🚀 手动切换
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300
custom_proxy_group=🚀 手动切换`select`.*


; === 2. 核心控制组 (Master Group) ===
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🚀 手动切换`[]⚡️ AI纯净优选`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点`[]🇸🇬 新加坡节点`[]📥 下载专用`[]DIRECT


; === 3. 应用策略组 ===

; 💬 Ai平台
custom_proxy_group=💬 Ai平台`select`[]⚡️ AI纯净优选`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🚀 节点选择

; ☁️ 国外云盘
custom_proxy_group=☁️ 国外云盘`select`[]📥 下载专用`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点

; 📹 油管视频
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点

; 🎬 日韩媒体
custom_proxy_group=🎬 日韩地区`select`[]🚀 节点选择`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇭🇰 香港节点`[]DIRECT

; 🎮 游戏平台 (建议将节点选择提前，方便手动切换特定线路)
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点

; 📲 电报信息
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇺🇲 美国节点

; 🌍 国外媒体
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇸🇬 新加坡节点

; Ⓜ️ 微软 & 🍎 苹果
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点

; 📢 谷歌FCM
custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]DIRECT

; === 4. 拦截与直连 ===
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT

