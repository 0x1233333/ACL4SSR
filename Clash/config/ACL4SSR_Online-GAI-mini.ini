; ==============================================
; 策略组配置 (Proxy Groups)
; ==============================================

; --- 核心分组 ---

; 🚀 节点选择
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🐢 慢速节点`[]🚀 手动切换`[]DIRECT

; ♻️ 自动选择：测速改用 Cloudflare
custom_proxy_group=♻️ 自动选择`url-test`^(?!.*(jgw|Oracle|甲骨文|官网|剩余|到期)).*`http://cp.cloudflare.com/generate_204`300,,50

; 🚀 手动切换
custom_proxy_group=🚀 手动切换`select`.*

; 🐢 慢速节点：jgw/Oracle 的“监狱”
custom_proxy_group=🐢 慢速节点`select`(?i)(jgw|Oracle|甲骨文)


; --- 应用分组 ---

; Ai平台
custom_proxy_group=💬 Ai平台`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🚀 节点选择`[]🚀 手动切换

; PikPak
custom_proxy_group=☁️ PikPak`select`[]📥 下载节点`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择

; 金融服务
custom_proxy_group=💰 金融服务`select`[]🇯🇵 日本节点`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 节点选择`[]🚀 手动切换`[]DIRECT

; 电报
custom_proxy_group=📲 电报消息`select`[]♻️ 自动选择`[]🚀 节点选择`[]📥 下载节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]DIRECT

; 油管
custom_proxy_group=📹 油管视频`select`[]♻️ 自动选择`[]🚀 节点选择`[]📥 下载节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]DIRECT

; 哔哩哔哩
custom_proxy_group=📺 哔哩哔哩`select`[]🎯 全球直连`[]🇭🇰 香港节点`[]🚀 节点选择

; 国外媒体
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]DIRECT

; 谷歌FCM & 微软苹果
custom_proxy_group=📢 谷歌FCM`select`[]♻️ 自动选择`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]DIRECT
custom_proxy_group=Ⓜ️ 微软Bing`select`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 微软服务`select`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换
custom_proxy_group=🍎 苹果服务`select`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换


; --- 拦截与直连分组 ---
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择

; 🛑 广告拦截
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT

; 🐟 漏网之鱼
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换


; === 地区/专属策略组 (保持不变) ===

; 📥 下载节点 (专属命名：wx/s801)
custom_proxy_group=📥 下载节点`select`(?i)(wx|s801)

custom_proxy_group=🇭🇰 香港节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(hk|港)
custom_proxy_group=🇯🇵 日本节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(jp|日本|jparm|c93s4)
custom_proxy_group=🇰🇷 韩国节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(kr|韩)
custom_proxy_group=🇺🇲 美国节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(us|美|c93s)

enable_rule_generator=true
overwrite_original_rules=true
