; ==============================================
; 策略组配置 (Proxy Groups) - 隔离优化版
; ==============================================

; --- 核心分组 ---

; 🚀 节点选择：手动切换，作为主力。严格排除了慢速/卡顿节点。
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🐢 慢速节点`[]🚀 手动切换`[]DIRECT

; ♻️ 自动选择：日常使用的自动优选，排除了 jgw/Oracle 等卡顿关键词。
custom_proxy_group=♻️ 自动选择`url-test`^(?!.*(jgw|Oracle|甲骨文|官网|剩余|到期)).*`https://www.gstatic.com/generate_204`300,,50

; 🚀 手动切换：包含所有节点（作为备用，万一你需要用某个特定节点）。
custom_proxy_group=🚀 手动切换`select`.*

; 🐢 慢速节点：专门把 jgw 和 Oracle 关在这里，平时不用看它们。
custom_proxy_group=🐢 慢速节点`select`(?i)(jgw|Oracle|甲骨文)

; --- 应用分组 ---

; Ai平台：保留你的原始逻辑，但排除了慢速节点，防止跳到 Oracle 上。
custom_proxy_group=💬 Ai平台`select`[]⚡️ AI纯净优选`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🚀 手动切换

; PikPak：通常走代理更快。
custom_proxy_group=☁️ PikPak`select`[]📥 下载节点`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]♻️ 自动选择

; 金融服务：推荐手动指定，防止跳IP。
custom_proxy_group=💰 金融服务`select`[]🇭🇰 香港节点`[]🎯 全球直连`[]🚀 节点选择`[]🚀 手动切换`[]DIRECT

; 电报：走自动选择。
custom_proxy_group=📲 电报消息`select`[]♻️ 自动选择`[]🚀 节点选择`[]📥 下载节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]DIRECT

; 油管：
custom_proxy_group=📹 油管视频`select`[]♻️ 自动选择`[]🚀 节点选择`[]📥 下载节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]DIRECT

; 哔哩哔哩：
custom_proxy_group=📺 哔哩哔哩`select`[]🎯 全球直连`[]🇭🇰 香港节点`[]🚀 节点选择

; 国外媒体：
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]DIRECT

; === 【修改点：修复谷歌FCM和微软直连问题】 ===
; 谷歌FCM：移除 DIRECT 首选，改用自动或手动，保证推送连接。
custom_proxy_group=📢 谷歌FCM`select`[]♻️ 自动选择`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]DIRECT

; 微软/苹果：移除 DIRECT 首选，改为节点选择优先，解决登录慢/同步卡问题。
custom_proxy_group=Ⓜ️ 微软Bing`select`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 微软服务`select`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换
custom_proxy_group=🍎 苹果服务`select`[]🚀 节点选择`[]DIRECT`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换

custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换

custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换

; === 地区策略组 (基于最新正则) ===

; ⚡️ AI纯净优选 (保留你原来的逻辑，但再次加强排除 jgw/oracle)
custom_proxy_group=⚡️ AI纯净优选`url-test`(?i)^(?=.*(us|美|jp|日|kr|韩|sg|新|tw|台))(?!.*(oracle|甲骨文|jgw|jparm|cc1|cc2|wx|s801))`https://www.gstatic.com/generate_204`300,,150

; 📥 下载节点 (保留你原来的正则)
custom_proxy_group=📥 下载节点`url-test`(?i)(wx|s801)`https://www.gstatic.com/generate_204`300,,150

; === 【修改点：地区节点防跳IP + 隔离 jgw/Oracle】 ===
; 只要名字里带 jgw 或 oracle 或 甲骨文，就不会出现在下面这些地区分组里。

; 🇭🇰 香港
custom_proxy_group=🇭🇰 香港节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(hk|港)`https://www.gstatic.com/generate_204`300,,150

; 🇯🇵 日本
custom_proxy_group=🇯🇵 日本节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(jp|日本|jparm|c93s4)`https://www.gstatic.com/generate_204`300,,150

; 🇰🇷 韩国
custom_proxy_group=🇰🇷 韩国节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(kr|韩)`https://www.gstatic.com/generate_204`300,,150

; 🇺🇲 美国
custom_proxy_group=🇺🇲 美国节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(us|美|c93s)`https://www.gstatic.com/generate_204`300,,200
