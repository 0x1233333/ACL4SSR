; ==============================================
; 策略组配置 (Proxy Groups)
; ==============================================

; 核心分组：加入“🏠 回家”策略组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]⚡️ AI纯净优选`[]🏠 回家`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]📥 下载节点`[]🚀 手动切换`[]DIRECT

; 【新增】回家专用分组：抓取 "回家/home/cn"，排除测速，手动选择
custom_proxy_group=🏠 回家`select`(?i)(回家|home|cn)

; 🚀 手动切换：抓取所有节点，但排除 "回家" 系列
custom_proxy_group=🚀 手动切换`select`^(?!.*(回家|home|cn)).*

; ♻️ 自动选择：排除 "回家" 系列
custom_proxy_group=♻️ 自动选择`url-test`^(?!.*(回家|home|cn)).*`https://www.gstatic.com/generate_204`300

