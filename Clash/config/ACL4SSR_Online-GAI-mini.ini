port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: true
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090

geox-url:
  geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
geo-auto-update: true
geo-update-interval: 24

dns:
  enable: true
  cache-algorithm: lru
  prefer-h3: false
  ipv6: true
  listen: "[::]:1053"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  respect-rules: true
  use-hosts: true
  use-system-hosts: true

  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "www.msftconnecttest.com"
    - "www.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "time-ios.apple.com"
    - "time1.cloud.tencent.com"
    - "ntp.*.com"
    - "ntp.*.com.cn"
    - "pool.ntp.org"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
    - "xbox.*.microsoft.com"
    - "+.battlenet.com.cn"
    - "+.wotgame.cn"
    - "+.wggames.cn"
    - "+.wowsgame.cn"
    - "+.wargaming.net"
    - "+.router.asus.com"
    - "+.miwifi.com"
    - "+.tplogin.cn"
    - "+.zte.home"

  # 只用于解析 DoH 服务器自身域名，必须保留普通 IP DNS。
  # 国内两家：阿里云 + 腾讯 DNSPod；IPv4/IPv6 各一个。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 2400:3200::1
    - 2402:4e00::

  # 默认基底使用国外加密 DNS。国内域名由 nameserver-policy 精确改走国内 DNS。
  # 这样可降低未知 AI / 交易所域名被国内 DNS 解析污染或误判的概率。
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query

  # 直连出口解析仍然走国内加密 DNS。
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true

  # 用于解析代理节点域名。保留国内 DNS，不强行剥离 AAAA，避免 IPv6 节点失效。
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  nameserver-policy:
    "geosite:private,cn,apple-cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

    "geosite:geolocation-!cn,gfw":
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query

proxies: []

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚀 手动切换
      - DIRECT

  - name: 🚀 手动切换
    type: select
    proxies:
      - __ALL_PROXIES__

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - __ALL_PROXIES__

  - name: 📲 电报消息
