[common]
; 通用设置
api_mode=true
exclude_remarks=(到期|剩余|官网|过期|流量|测试|账户|重置|回国)
; 启用规则生成器
enable_rule_generator=true
overwrite_original_rules=true

; ==============================================
; 策略组配置 (Proxy Groups)
; 逻辑顺序修正：底层节点 -> 功能分组 -> 核心选择
; ==============================================
[proxy_group]

; === 第一步：定义底层节点筛选 (最先定义，供后续引用) ===

; 1. ⚡️ AI纯净优选 (严格 HTTPS 测速 + 排除高风险商家)
custom_proxy_group=⚡️ AI纯净优选`url-test`(?i)^(?=.*(us|美|jp|日|kr|韩|sg|新|tw|台|uk|英))(?!.*(oracle|甲骨文|jgw|jparm|cc1|cc2|vultr|racknerd|cloudcone|rn|bwg))`https://www.gstatic.com/generate_204`300,,50

; 2. 地区节点 (严格 HTTPS 测速)
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)(hk|港)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)(jp|日本)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国节点`url-test`(?i)(kr|韩)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(?i)(us|美)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(?i)(sg|新)`https://www.gstatic.com/generate_204`300,,50

; 3. 📥 下载专用 (筛选大流量节点)
custom_proxy_group=📥 下载专用`select`(?i)(s801|wx|倍|x)

; 4. ♻️ 自动选择 (全节点测速)
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50

; 5. 🚀 手动切换 (包含所有节点，作为备用)
custom_proxy_group=🚀 手动切换`select`.*


; === 第二步：定义核心总控 (引用上面的底层组) ===

; 🚀 节点选择 (主策略，引用了下面的功能和地区)
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🚀 手动切换`[]⚡️ AI纯净优选`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点`[]🇸🇬 新加坡节点`[]📥 下载专用`[]DIRECT


; === 第三步：定义功能应用 (引用主策略或底层组) ===

; 💬 Ai平台
custom_proxy_group=💬 Ai平台`select`[]⚡️ AI纯净优选`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🚀 节点选择

; ☁️ 国外云盘
custom_proxy_group=☁️ 国外云盘`select`[]📥 下载专用`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点

; 🎮 游戏平台
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点

; 📹 油管视频
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点

; 🎬 日韩地区 (特定流媒体)
custom_proxy_group=🎬 日韩地区`select`[]🚀 节点选择`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇭🇰 香港节点`[]DIRECT

; 📲 电报信息
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇺🇲 美国节点

; Ⓜ️ 微软服务 & 🍎 苹果服务
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点

; 🌍 国外媒体
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点

; 🛑 全球拦截
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT

; === 第四步：兜底 ===

custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT

; ==============================================
; 规则集配置 (Rule Sets)
; ==============================================
[ruleset]
enabled=true
overwrite_original_rules=true

; 1. 广告拦截
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list

; 2. 微软 & 苹果
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

; 3. 功能应用
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=☁️ 国外云盘,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PikPak/PikPak.list
ruleset=☁️ 国外云盘,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/NetDisk.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/Game.list
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

; 4. 地区/大厂
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list
ruleset=🎬 日韩地区,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Niconico/Niconico.list
ruleset=🎬 日韩地区,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Pixiv/Pixiv.list

; 5. 兜底逻辑
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

; 6. 国内直连
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL
