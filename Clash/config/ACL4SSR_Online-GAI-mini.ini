; === ACL4SSR 通用全能优化版 (Mihomo/Clash Meta) ===
; 核心目标：IPv6 客户端控制 + Gemini 地区合规 + 小众网站全兼容

# --- 全局设置 ---
# 已删除 ipv6: false，由客户端自行控制
allow-lan: true
mixed-port: 7890
unified-delay: true
tcp-concurrent: true
external-controller: 0.0.0.0:9090

# --- 核心嗅探 (解决小众网站打不开的关键) ---
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  force-domain:
    - "+"

# --- DNS 专项配置 ---
dns:
  enable: true
  # 已删除 ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alicdn.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# --- 顶部规则 (优先级最高) ---
# 已删除 IP-CIDR6,::/0,REJECT 规则

# 屏蔽 Google/YouTube QUIC (防止代理降级，提升视频加载速度)
custom_rule_top=AND,((DOMAIN-KEYWORD,google),(NETWORK,UDP),(DST-PORT,443)),REJECT
custom_rule_top=AND,((DOMAIN-KEYWORD,youtube),(NETWORK,UDP),(DST-PORT,443)),REJECT

# --- 规则集引用 ---
# AI 相关规则 (强制走 AI 专用组)
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
# 国内媒体 (Bilibili 等)
ruleset=📺 哔哩哔哩,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Bilibili.list
# 国内常用域名强制直连 (提升国内打开速度)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

# 其他常规分流
ruleset=💰 加密货币,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Crypto/Crypto.list
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🎮 Steam,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.yaml
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

# 地理位置判断
ruleset=🎯 全球直连,[]GEOIP,CN

# ====== 1. 核心策略组 ======
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇲 美国节点`[]🚀 手动切换`[]DIRECT

custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,150

custom_proxy_group=🚀 手动切换`select`.*

# ====== 2. 地区策略组 ======
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)hk|hongkong|港`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)jp|japan|日本`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇺🇲 美国节点`url-test`(?i)us|unitedstates|america|美`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇸🇬 新加坡节点`url-test`(?i)sg|singapore|新`http://www.gstatic.com/generate_204`300,,150

# ====== 3. 应用分流组 ======
# Ai平台策略组：严禁出现香港等不支持 Gemini 的地区
custom_proxy_group=💬 Ai平台`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🚀 节点选择

# 国内媒体默认直连，确保 B站加载速度
custom_proxy_group=📺 哔哩哔哩`select`[]DIRECT`[]🇭🇰 香港节点`[]🚀 节点选择

custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择`[]DIRECT
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇺🇲 美国节点
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]🇸🇬 新加坡节点
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🎯 全球直连`select`[]DIRECT

# 漏网之鱼：针对没写规则的小众国外网站，建议保持走代理
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT

# --- 底部设置 ---
custom_rule_bottom=MATCH,🐟 漏网之鱼
enable_rule_generator=true
overwrite_original_rules=true
