; === 地区策略组 (基于最新正则与 HTTPS 测速) ===

; ⚡️ AI纯净优选 (严格排除甲骨文/CC/下载节点)
custom_proxy_group=⚡️ AI纯净优选`url-test`(?i)^(?=.*(us|美|jp|日|kr|韩|sg|新|tw|台))(?!.*(oracle|甲骨文|jgw|jparm|cc1|cc2|wx|s801))`https://www.gstatic.com/generate_204`300,,150

; 📥 下载节点 (提取 wx 和 s801)
custom_proxy_group=📥 下载节点`url-test`(?i)(wx|s801)`https://www.gstatic.com/generate_204`300,,150

; 🇭🇰 香港 (简化正则)
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)(hk|港)`https://www.gstatic.com/generate_204`300,,150

; 🇯🇵 日本 (含甲骨文 jp-Oracle)
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)(jp|日本|jparm|c93s4)`https://www.gstatic.com/generate_204`300,,150

; 🇰🇷 韩国 (含甲骨文 kr-Oracle)
custom_proxy_group=🇰🇷 韩国节点`url-test`(?i)(kr|韩)`https://www.gstatic.com/generate_204`300,,150

; 🇺🇲 美国 (通用美国组)
custom_proxy_group=🇺🇲 美国节点`url-test`(?i)(us|美|c93s)`https://www.gstatic.com/generate_204`300,,200

enable_rule_generator=true
overwrite_original_rules=true
