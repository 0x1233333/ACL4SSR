; ==============================================================
; SubConverter-Extended 2026 深度审计终极版 (V11 - 负载均衡容灾版)
; 
; 【系统架构与分流逻辑审计清单 (Audit Log)】
; 1. 故障域隔离 (HK/Oracle)：因香港直连极慢，在 [♻️ 自动选择] 中剔除 `hk|港`。
; 2. 标签复用 (wx)：通过 `(?i)(wx)` 将 wx 节点并入 [📥 下载节点]，非排他匹配保留其原生地区归属。
; 3. 强特征接管 (特殊US节点)：针对无前缀美国节点，硬编码后缀 `\.top-(?:VLESS|singbox|anytls)` 强制捕获。
; 4. 伪装节点重定向 (Fake JP)：识别到 `jpzfvps2`, `jpprou`, `JPSB3` 实为美国。在 [🇯🇵 日本节点] 剔除并交由 [🇺🇲 美国节点] 接管。
; 5. 颗粒度路由 (s801/c93s4)：`s801` 划入下载组，`c93s4` 强制划入日本组，均在 [🇺🇲 美国节点] 中排斥以防越界。
; 6. 基础设施防劫持 (FCM/Bing)：剥离 Google FCM 与 微软 Bing 的 DIRECT，防止 SNI 阻断与 cn.bing.com 重定向。
; 7. 区域限制突破 (成人内容)：尾部兜底项采用 [🐢 慢速节点]，利用甲骨文 (Oracle) 韩国原生 IP 特性突破锁区。
; 8. CRS/风控合规 (离岸金融)：精简至加密货币。强制剔除 US 节点，防止触发 Binance/OKX 清退机制。
; 9. 容灾重构 (漏网之鱼/负载均衡)：新增 [⚖️ 负载均衡] 组 (fallback 模式)，提取除甲骨文与香港外的所有节点。将 [🐟 漏网之鱼] 改为 select，默认首选该负载均衡组。
; ==============================================================

[common]
enable_rule_generator=true
overwrite_original_rules=true

[rulesets]
; 🔴【Priority 0：本地强分流】
ruleset=📺 哔哩哔哩,[]DOMAIN-KEYWORD,Bilibili
ruleset=📺 哔哩哔哩,[]DOMAIN-KEYWORD,bilibili

; 🔴【Priority 1：强制拦截】
ruleset=🚫 广告拦截,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.list

; 🔴【Priority 2：全球直连】
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list

; --- 💰 离岸金融 (严防 CRS 2.0，仅限加密货币) ---
ruleset=💰 金融服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Cryptocurrency/Cryptocurrency.list
ruleset=💰 金融服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Binance/Binance.list
ruleset=💰 金融服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OKX/OKX.list

; --- 💬 AI 平台 ---
ruleset=💬 Ai平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=💬 Ai平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list

