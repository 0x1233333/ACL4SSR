; === ACL4SSR 最终完美修复版 (修复 DNS 缺失问题) ===
; 核心修复：使用 custom_config 语法强制生成 DNS 配置，开启 Fake-IP

; ====== 1. 全局设置 (custom_config 写法) ======
custom_config=allow-lan`true
custom_config=mixed-port`7890
custom_config=unified-delay`true
custom_config=tcp-concurrent`true
custom_config=external-controller`0.0.0.0:9090
custom_config=keep-alive-interval`15

; ====== 2. 核心嗅探 (必开) ======
custom_config=sniffer.enable`true
custom_config=sniffer.sniff.TLS.ports`[443, 8443]
custom_config=sniffer.sniff.HTTP.ports`[80, 8080-8880]
custom_config=sniffer.force-domain`["+"]
custom_config=sniffer.override-destination`true

; ====== 3. DNS 配置 (这里是修复核心！！！) ======
; 注意：必须用 custom_config=key`value 的格式，不能直接写 YAML
custom_config=dns.enable`true
custom_config=dns.ipv6`false
custom_config=dns.listen`:1053
custom_config=dns.enhanced-mode`fake-ip
custom_config=dns.fake-ip-range`198.18.0.1/16
custom_config=dns.use-hosts`true

; 配置上游 DNS (防止污染)
custom_config=dns.nameserver`["https://doh.pub/dns-query", "https://dns.alidns.com/dns-query"]
custom_config=dns.fallback`["https://dns.google/dns-query", "https://1.1.1.1/dns-query", "tls://8.8.4.4", "tls://1.1.1.1"]

; DNS 分流 (国内域名走国内DNS，国外走Fake-IP)
custom_config=dns.fallback-filter.geoip`true
custom_config=dns.fallback-filter.geoip-code`CN
custom_config=dns.fallback-filter.ipcidr`["240.0.0.0/4"]

