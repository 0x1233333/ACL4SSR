; === ACL4SSR 纯净定制版 (由 Gemini 为周鑫尧优化) ===
; 核心逻辑：精准排除甲骨文，所有未定义节点（含 nomao）自动进入未知组

; --- 顶部与底部规则 ---
custom_rule_top=AND,((DOMAIN-KEYWORD,googlevideo),(NETWORK,UDP),(DST-PORT,443)),REJECT
custom_rule_top=AND,((DOMAIN-KEYWORD,youtube),(NETWORK,UDP),(DST-PORT,443)),REJECT
custom_rule_bottom=MATCH,🐟 漏网之鱼

; --- 规则集 ---
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=💰 加密货币,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Crypto/Crypto.list
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🎬 日韩媒体,https://raw.githubusercontent.com/Meilieage/webcdn/main/rule/list/RiHanMeiTi.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,[]GEOIP,CN

; --- 策略组定义 ---

; 1. 基础核心组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🌀 其他未知`[]🚀 手动切换`[]DIRECT

; 2. 自动测速
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,150

; 3. 手动切换
custom_proxy_group=🚀 手动切换`select`.*

; ====== 应用分流组 ======
custom_proxy_group=💬 Ai平台`select`[]🚀 节点选择`[]♻️ 自动选择`[]🐢 甲骨文组`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]DIRECT
custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]DIRECT
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🐢 甲骨文组`[]DIRECT
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🐢 甲骨文组`[]DIRECT
custom_proxy_group=🎬 日韩媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇭🇰 香港节点`[]DIRECT
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]🌀 其他未知`[]DIRECT

; ====== 地区测速分组 (修改重点) ======

; 香港：排除甲骨文
custom_proxy_group=🇭🇰 香港节点`url-test`^(?=.*(港|HK|hk|Hong Kong))(?!.*([Oo]racle|甲骨文|jgw))`http://www.gstatic.com/generate_204`300,,150

; 日本：增加特征词，排除甲骨文
custom_proxy_group=🇯🇵 日本节点`url-test`^(?=.*(日本|JP|Japan|lyjp|jpwx|jpprou|u-can|c93s4))(?!.*([Oo]racle|甲骨文|jgw|jparm))`http://www.gstatic.com/generate_204`300,,150

; 美国：排除甲骨文，并根据你的要求【排除 nomao】
custom_proxy_group=🇺🇲 美国节点`url-test`^(?=.*(美|US|United States|uswx|us1|bwgdc|dmitus))(?!.*([Oo]racle|甲骨文|jgw|nomao))`http://www.gstatic.com/generate_204`300,,200

; 韩国：排除甲骨文
custom_proxy_group=🇰🇷 韩国节点`url-test`^(?=.*(韩|KR|Korea|seoul))(?!.*([Oo]racle|甲骨文|jgw|cc1|cc2))`http://www.gstatic.com/generate_204`300,,200

; 🐢 甲骨文专组
custom_proxy_group=🐢 甲骨文组`url-test`([Oo]racle|甲骨文|jgw|jparm|cc1|cc2)`http://www.gstatic.com/generate_204`300,,200

; 🌀 其他未知：匹配所有不含上述国家关键字的节点，或者名字里带 nomao 的节点
custom_proxy_group=🌀 其他未知`url-test`^(?!.*(港|HK|hk|日本|JP|Japan|美|US|韩|KR|Korea|[Oo]racle|甲骨文|jgw|jparm|cc1|cc2)).*|nomao`http://www.gstatic.com/generate_204`300,,200

enable_rule_generator=true
overwrite_original_rules=true
