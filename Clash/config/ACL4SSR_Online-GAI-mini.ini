; === ACL4SSR 最终优化版 (2025-12-29 修复直连排序版) ===
; 状态：✅ 修复国外网站误走直连 | ✅ GFW列表优先匹配 | ✅ 金融/AI分流正常

; --- 顶部自定义规则 (优先级最高) ---
custom_rule_top=AND,((DOMAIN-KEYWORD,googlevideo),(NETWORK,UDP),(DST-PORT,443)),REJECT
custom_rule_top=AND,((DOMAIN-KEYWORD,youtube),(NETWORK,UDP),(DST-PORT,443)),REJECT

; --- 底部自定义规则 (兜底) ---
custom_rule_bottom=MATCH,🐟 漏网之鱼

; --- 规则集部分 (RuleSet) ---

; 1. [置顶] 核心 AI (必须最优先)
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,challenges.cloudflare.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,ai.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,openai.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,bard.google.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,makersuite.google.com
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

; 2. [核心] 加密货币
ruleset=💰 加密货币,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Crypto/Crypto.list

; 3. [应用代理] 必须走代理的特定APP (Google/TG/Media)
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
; 强制 GoogleCN 走代理，防止访问卡顿
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🎬 日韩媒体,https://raw.githubusercontent.com/Meilieage/webcdn/main/rule/list/RiHanMeiTi.list
ruleset=🐝 PikPak,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PikPak/PikPak.list

; 4. [游戏平台]
ruleset=🎮 Steam,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.yaml
ruleset=🎮 Steam,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/SteamCN/SteamCN.yaml
ruleset=🎮 Switch,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Nintendo/Nintendo.yaml

; 5. [关键调整] 墙列表与代理列表 (提权到国内规则之前)
; 修复核心：先判断是否在墙单里，在的话强制走代理，不再被 GEOIP 误判
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list

; 6. [局域网与直连白名单]
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

; 7. [微软与苹果] (放在墙单后，国内域名单前)
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

; 8. [国内规则] (仅当上面都没匹配时，才判断是否为国内域名/IP)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
; GEOIP 放在最后，作为最后的直连判断依据
ruleset=🎯 全球直连,[]GEOIP,CN

; --- 分组策略部分 (Proxy Group) ---

; 1. 核心总选择组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🚀 手动切换`[]DIRECT`[]⛓️ 媒体完全自定义中转

; 2. 自动测速组
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,150

; 3. 手动切换
custom_proxy_group=🚀 手动切换`select`.*

