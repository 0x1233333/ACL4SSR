; Ai平台：排除香港节点，强制首选美国或日本
custom_proxy_group=💬 Ai平台`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🐢 甲骨文组`[]🚀 节点选择`[]♻️ 自动选择`[]🌀 其他未知

custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🐢 甲骨文组`[]DIRECT
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🐢 甲骨文组`[]DIRECT
