ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

[proxy_groups]
; 🚀 核心选择组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]⚖️ 负载均衡`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🐢 慢速节点`[]📥 下载节点`[]🚀 手动切换`[]DIRECT

; ♻️ 自动选择：纯净路由 (仅剔除 香港/甲骨文/信息节点，已恢复美国节点测速)
custom_proxy_group=♻️ 自动选择`url-test`(?i)^(?!.*(jgw|Oracle|甲骨文|官网|剩余|到期|hk|港)).*`http://cp.cloudflare.com/generate_204`300,,50

; ⚖️ 负载均衡：高可用容灾 (fallback 模式，剔除甲骨文与香港，所有可用节点平铺自动切换)
custom_proxy_group=⚖️ 负载均衡`fallback`(?i)^(?!.*(jgw|Oracle|甲骨文|hk|港)).*`http://cp.cloudflare.com/generate_204`300

; --- 💰 离岸金融 (物理隔离：强制剔除 US 防风控清退) ---
custom_proxy_group=💰 金融服务`select`[]🇯🇵 日本节点`[]🚀 手动切换

; --- 💬 AI 平台 (允许美国纯净 IP) ---
custom_proxy_group=💬 Ai平台`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点

; --- 🔞 成人内容 (按区域屏蔽特性设定回退顺序，慢速节点兜底以利用韩国甲骨文) ---
custom_proxy_group=🔞 成人内容`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🐢 慢速节点

; --- 应用分组 ---
; 漏网之鱼改为 select 并首选负载均衡作为兜底保障
custom_proxy_group=🐟 漏网之鱼`select`[]⚖️ 负载均衡`[]♻️ 自动选择`[]🇯🇵 日本节点`[]🇰🇷 韩国节点
custom_proxy_group=☁️ PikPak`select`[]📥 下载节点`[]🐢 慢速节点`[]🚀 节点选择
custom_proxy_group=📺 哔哩哔哩`select`[]🎯 全球直连`[]🇭🇰 香港节点`[]📥 下载节点
custom_proxy_group=📹 油管视频`select`[]♻️ 自动选择`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇺🇲 美国节点
custom_proxy_group=📲 电报消息`select`[]♻️ 自动选择`[]🚀 节点选择`[]📥 下载节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]📥 下载节点`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 节点选择

; --- 基础设施 ---
custom_proxy_group=📢 谷歌FCM`select`[]♻️ 自动选择`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 微软Bing`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🇺🇲 美国节点`[]🍎 苹果服务
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🇺🇲 美国节点`[]🇯🇵 日本节点

; --- 拦截与直连 ---
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🚫 广告拦截`select`[]REJECT`[]DIRECT

; === 正则筛选器 (地区组) ===
; 独立提取 wx 与 s801 至下载组
custom_proxy_group=📥 下载节点`select`(?i)(wx|s801)
; 常规香港，剔除甲骨文
custom_proxy_group=🇭🇰 香港节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(hk|港|hongkong)
; 剔除伪装美国节点，强行纳入 c93s4
custom_proxy_group=🇯🇵 日本节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文|jpzfvps2|jpprou|JPSB3)).*(jp|日本|tokyo|c93s4)
; 常规韩国，剔除甲骨文
custom_proxy_group=🇰🇷 韩国节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文)).*(kr|韩|seoul)
; 剔除 s801/c93s4，包含常规 us，接管特殊 top 域名与伪装节点
custom_proxy_group=🇺🇲 美国节点`select`(?i)^(?!.*(jgw|Oracle|甲骨文|c93s4|s801)).*(us|美|unitedstates|c93s|\.top-(?:VLESS|singbox|anytls)|jpzfvps2|jpprou|JPSB3)
; 提取甲骨文作为慢速兜底
custom_proxy_group=🐢 慢速节点`select`(?i)(jgw|Oracle|甲骨文)
; 无限制全量捕获
custom_proxy_group=🚀 手动切换`select`.*
