; ====== 地区测速分组 (核心修改点) ======

; 1. 香港节点：mail系列的hk节点
custom_proxy_group=🇭🇰 香港节点`url-test`^(?=.*(港|HK|hk|Hong Kong))(?!.*([Oo]racle|甲骨文|jgw))`http://www.gstatic.com/generate_204`300,,150

; 2. 日本节点：含 c93s4, lyjp, jpwx, jpprou 以及 oracle 以外的 JP 节点
custom_proxy_group=🇯🇵 日本节点`url-test`^(?=.*(日本|JP|Japan|lyjp|jpwx|jpprou|c93s4))(?!.*([Oo]racle|甲骨文|jgw))`http://www.gstatic.com/generate_204`300,,150

; 3. 美国节点：c93s1/2/3, mail系列中的 uswx/us1/bwgdc, 以及 nomaoV6
custom_proxy_group=🇺🇲 美国节点`url-test`^(?=.*(美|US|United States|c93s1|c93s2|c93s3|uswx|us1|bwgdc|nomaoV6))(?!.*([Oo]racle|甲骨文|jgw))`http://www.gstatic.com/generate_204`300,,200

; 4. 甲骨文组：锁定 jgw@oracle.com 关键字
custom_proxy_group=🐢 甲骨文组`url-test`([Oo]racle|甲骨文|jgw)`http://www.gstatic.com/generate_204`300,,200

; 5. 其他未知：放置您不确定国家的 lazf 节点
custom_proxy_group=🌀 其他未知`url-test`lazf`http://www.gstatic.com/generate_204`300,,200

