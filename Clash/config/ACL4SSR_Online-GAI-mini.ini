custom_proxy_group=🐝 PikPak`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🌀 其他未知`[]DIRECT

; Steam：全补全
custom_proxy_group=🎮 Steam`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🌀 其他未知`[]DIRECT

