; === ACL4SSR 最终优化配置 (LS GitHub直连/Gemini修复版) ===
; 更新时间：2025-12-01 22:00
; 适用环境：海外后端 (可直连 GitHub)
; 核心功能：
; 1. [规则源] 使用 Loyalsoldier GitHub 官方源，确保规则最新且完整。
; 2. [Gemini] 强制修复头像显示与对话连接。
; 3. [防卡顿] 精准阻断 YouTube QUIC (UDP 443)，解决视频缓冲。

; --- 顶部自定义规则 (YouTube 专用 QUIC 阻断) ---
; 仅拦截 YouTube/GoogleVideo 的 UDP，放行 Gemini 和其他流量
custom_rule_top=AND,((DOMAIN-KEYWORD,youtube),(NETWORK,UDP)),REJECT
custom_rule_top=AND,((DOMAIN-KEYWORD,googlevideo),(NETWORK,UDP)),REJECT
custom_rule_top=AND,((DOMAIN-SUFFIX,ggpht.com),(NETWORK,UDP)),REJECT

; --- 底部自定义规则 ---
custom_rule_bottom=MATCH,🐟 漏网之鱼

; --- 规则集部分 (RuleSet) ---

; ====== 0. [置顶] AI 平台 & Gemini 修复 (优先级最高) ======
; 强制 Google 用户内容(头像)和 API 走 AI 代理
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,googleusercontent.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,googleapis.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,challenges.cloudflare.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,ai.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,openai.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,bard.google.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,makersuite.google.com
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

; ====== 1. 加密货币 & TradingView ======
ruleset=💰 加密货币,https://raw.githubusercontent.com/0x1233333/bank-Crypto/refs/heads/main/Crypto.list
ruleset=💰 加密货币,[]DOMAIN-SUFFIX,tradingview.com
ruleset=💰 加密货币,[]DOMAIN-SUFFIX,tradingview-widget.com
ruleset=💰 加密货币,[]DOMAIN-KEYWORD,tradingview

; ====== 2. 流媒体服务 ======
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🎬 日韩媒体,https://raw.githubusercontent.com/Meilieage/webcdn/main/rule/list/RiHanMeiTi.list
ruleset=🐝 PikPak,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PikPak/PikPak.list

; ====== 3. 游戏服务 ======
ruleset=🎮 Steam,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.yaml
ruleset=🎮 Steam,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/SteamCN/SteamCN.yaml
ruleset=🎮 Switch,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Nintendo/Nintendo.yaml

; ====== 4. Loyalsoldier 专用分类 (GitHub 直连) ======

; [苹果服务] (包含 iCloud) -> 走苹果分流
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt

; [微软服务] (保留 ACL 源，LS 无专门微软列表)
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list

; [电报信息] -> 走电报分流
ruleset=📲 电报信息,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt

; [谷歌服务] (LS 的 Google 列表，作为 AI 规则后的补充) -> 走谷歌FCM分流(其实是通用谷歌)
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/google.txt

; ====== 5. Loyalsoldier 基础底层规则 (GitHub 直连) ======

; [直连：局域网/私有/直连域名/APP] -> 走全球直连
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/lancidr.txt
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/applications.txt
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt

; [代理：代理域名/GFW/非CN域名] -> 走节点选择
ruleset=🚀 节点选择,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
ruleset=🚀 节点选择,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.txt
ruleset=🚀 节点选择,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/tld-not-cn.txt

; [直连：国内 IP] -> 走全球直连
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt


; --- 分组策略部分 (Proxy Group) ---

; 1. 核心总选择组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]⛓️ 媒体完全自定义中转`[]🚀 手动切换`[]DIRECT

; 2. 自动测速组
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,150

; 3. 手动切换
custom_proxy_group=🚀 手动切换`select`.*

; 4. [聚合] Ai平台组 (Gemini 必须走这里)
custom_proxy_group=💬 Ai平台`select`[]⛓️ 媒体完全自定义中转`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🚀 手动切换`[]DIRECT

; 5. 地区测速组
custom_proxy_group=🇭🇰 香港节点`url-test`^(?=.*(港|HK|hk|Hong Kong|HongKong|hongkong))(?!.*([Oo]racle|甲骨文))`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇯🇵 日本节点`url-test`^(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|c93s4))(?!.*([Oo]racle|甲骨文))`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇺🇲 美国节点`url-test`^(?=.*(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|c93s1|c93s2|c93s3|c93s5|c93s801))(?!.*([Oo]racle|甲骨文))`http://www.gstatic.com/generate_204`300,,200

; 6. 甲骨文组
custom_proxy_group=🐢 甲骨文组`url-test`([Oo]racle|甲骨文)`http://www.gstatic.com/generate_204`300,,200

; ====== 自定义手动中转链 ======
custom_proxy_group=🅰️ 手选前置(入口)`select`[]DIRECT`.*
custom_proxy_group=🅱️ 手选后置(出口)`select`[]DIRECT`.*
custom_proxy_group=⛓️ 媒体完全自定义中转`relay`[]🅰️ 手选前置(入口)`[]🅱️ 手选后置(出口)
