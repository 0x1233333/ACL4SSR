; === ACL4SSR 最终优化配置 (CDN稳定/Gemini强制置顶版) ===
; 更新时间：2025-12-02 09:00
; 修复核心：
; 1. [下载修复] 规则源全部换回 CDN (jsdelivr)，确保 OpenClash 在国内能下载到数据。
; 2. [Gemini] 使用 custom_rule_top 强制接管 Gemini 和头像流量，优先级高于一切规则。
; 3. [防卡顿] 保留 YouTube QUIC 阻断。

; --- 顶部自定义规则 (优先级 Max) ---
; 注意：这里的规则会排在所有 RuleSet 之前，确保绝对生效

; 1. [Gemini/头像修复] 强制指向"💬 Ai平台"分组
custom_rule_top=DOMAIN-SUFFIX,googleusercontent.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,googleapis.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,gemini.google.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,bard.google.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,makersuite.google.com,💬 Ai平台
custom_rule_top=DOMAIN-KEYWORD,gemini,💬 Ai平台

; 2. [YouTube 防卡] 精准阻断 UDP 流量
custom_rule_top=AND,((DOMAIN-KEYWORD,youtube),(NETWORK,UDP)),REJECT
custom_rule_top=AND,((DOMAIN-KEYWORD,googlevideo),(NETWORK,UDP)),REJECT
custom_rule_top=AND,((DOMAIN-SUFFIX,ggpht.com),(NETWORK,UDP)),REJECT

; --- 底部自定义规则 ---
custom_rule_bottom=MATCH,🐟 漏网之鱼

; --- 规则集部分 (RuleSet) ---

; ====== 1. 加密货币 & TradingView ======
ruleset=💰 加密货币,https://raw.githubusercontent.com/0x1233333/bank-Crypto/refs/heads/main/Crypto.list
ruleset=💰 加密货币,[]DOMAIN-SUFFIX,tradingview.com
ruleset=💰 加密货币,[]DOMAIN-SUFFIX,tradingview-widget.com
ruleset=💰 加密货币,[]DOMAIN-KEYWORD,tradingview

; ====== 2. AI 平台 (其他AI规则) ======
ruleset=💬 Ai平台,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/AI.list
ruleset=💬 Ai平台,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/OpenAi.list

; ====== 3. 流媒体服务 ======
ruleset=📹 油管视频,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/YouTube.list
ruleset=🌍 国外媒体,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ProxyMedia.list
ruleset=🎬 日韩媒体,https://raw.githubusercontent.com/Meilieage/webcdn/main/rule/list/RiHanMeiTi.list
ruleset=🐝 PikPak,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/PikPak/PikPak.list

; ====== 4. 游戏服务 ======
ruleset=🎮 Steam,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.yaml
ruleset=🎮 Steam,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/SteamCN/SteamCN.yaml
ruleset=🎮 Switch,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Nintendo/Nintendo.yaml

; ====== 5. Loyalsoldier 规则集 (CDN 加速版) ======
; 使用 cdn.jsdelivr.net 确保 OpenClash 能稳定下载

; [苹果服务]
ruleset=🍎 苹果服务,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt
ruleset=🍎 苹果服务,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt

; [微软服务]
ruleset=Ⓜ️ 微软服务,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Microsoft.list

; [电报信息]
ruleset=📲 电报信息,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt

; [谷歌服务] (作为 AI 规则后的补充)
ruleset=📢 谷歌FCM,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt

; ====== 6. 基础底层规则 (CDN 加速版) ======

; [直连：局域网/私有/直连域名/APP]
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
