; === ACL4SSR 最终优化配置 (修复中转消失问题版) ===

;去广告：不支持 (已移除相关规则)
;自动测速：支持 (容差已提高，稳定性更高)
;微软分流：支持
;苹果分流：支持
;增强中国IP段：不支持
;增强国外GFW：不支持
;新增特性：支持手动选择前置和后置节点进行中转加速 (需要 Meta 内核)

; --- 规则集部分 (RuleSet) ---
; 保持原有的 GitHub 直链和规则文件
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=💰 加密货币,https://raw.githubusercontent.com/0x1233333/bank-Crypto/refs/heads/main/Crypto.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; --- 分组策略部分 (Proxy Group) ---

; 核心总选择组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🚀 手动切换`[]DIRECT

; 自动测速组 (容差保持 150)
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,150

custom_proxy_group=🚀 手动切换`select`.*

; 地区测速组 (保留原有正则和高容差设置)
custom_proxy_group=🇭🇰 香港节点`url-test`^(?=.*(港|HK|hk|Hong Kong|HongKong|hongkong))(?!.*([Oo]racle|甲骨文))`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇯🇵 日本节点`url-test`^(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|c93s4))(?!.*([Oo]racle|甲骨文))`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇺🇲 美国节点`url-test`^(?=.*(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|c93s1|c93s2|c93s3|c93s5|c93s801))(?!.*([Oo]racle|甲骨文))`http://www.gstatic.com/generate_204`300,,200

; 甲骨文组
custom_proxy_group=🐢 甲骨文组`url-test`([Oo]racle|甲骨文)`http://www.gstatic.com/generate_204`300,,200

; ====== 新增区域 (修复版)：自定义手动中转链 ======
; 修复说明：将 .* 改为引用 []🚀 节点选择，强制让转换器识别为非空组。

; 1. 【前置入口】手动选择组：内容与总选择组保持一致
custom_proxy_group=🅰️ 手选前置(入口)`select`[]🚀 节点选择

; 2. 【后置出口】手动选择组：内容与总选择组保持一致
custom_proxy_group=🅱️ 手选后置(出口)`select`[]🚀 节点选择

; 3. 【核心中转链】：(保持不变) 需要 Meta 内核支持 relay 类型
custom_proxy_group=⛓️ 媒体完全自定义中转`relay`[]🅰️ 手选前置(入口)`[]🅱️ 手选后置(出口)
; ======================================================

; 应用分组
; 【修改点】：在“国外媒体”中加入了新的自定义中转选项，并放在首位方便选择。
custom_proxy_group=🌍 国外媒体`select`[]⛓️ 媒体完全自定义中转`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🚀 手动切换`[]DIRECT

; 其他分组保持原样
custom_proxy_group=💰 加密货币`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🚀 手动切换`[]DIRECT
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🚀 手动切换`[]DIRECT
custom_proxy_group=Ⓜ️ 微软服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🍎 苹果服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🚀 手动切换`[]DIRECT
custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🐢 甲骨文组`[]🚀 手动切换`[]DIRECT

