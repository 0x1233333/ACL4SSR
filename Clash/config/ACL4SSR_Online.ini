; === ACL4SSR 最终优化配置 (全GitHub直链版) ===
; 更新时间：2025-12-01 16:30
; 适用环境：后端在海外 (可直连 GitHub)
; 核心变更：所有规则集均使用 raw.githubusercontent.com 官方源。

; --- 顶部自定义规则 (优先级 Max) ---
; 逻辑顺序：先放行 AI/头像，再拦截 YouTube UDP，确保 Gemini 不受影响

; 1. [Gemini/头像修复] 强制指向"💬 Ai平台"分组，优先级最高
custom_rule_top=DOMAIN-SUFFIX,googleusercontent.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,googleapis.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,challenges.cloudflare.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,ai.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,openai.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,gemini.google.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,bard.google.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,generativelanguage.googleapis.com,💬 Ai平台
custom_rule_top=DOMAIN-SUFFIX,makersuite.google.com,💬 Ai平台
custom_rule_top=DOMAIN-KEYWORD,gemini,💬 Ai平台

; 2. [YouTube 防卡] 精准阻断 UDP 流量 (已开启)
custom_rule_top=AND,((DOMAIN-KEYWORD,youtube),(NETWORK,UDP)),REJECT
custom_rule_top=AND,((DOMAIN-KEYWORD,googlevideo),(NETWORK,UDP)),REJECT
custom_rule_top=AND,((DOMAIN-SUFFIX,ggpht.com),(NETWORK,UDP)),REJECT

; --- 底部自定义规则 ---
custom_rule_bottom=MATCH,🐟 漏网之鱼

