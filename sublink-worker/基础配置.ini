port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: info
dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - '*'
    - +.lan
    - +.local
  nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query

  nameserver-policy:
    # 1. 明确是国内的、苹果的、微软的，走国内直连，保住下载速度
    "geosite:cn,apple,microsoft":
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query

    # 2. 剩下的所有域名（~），默认全部走代理隧道，去问 1.1.1.1，保住隐私和成功率
    "~": 
      - "https://1.1.1.1/dns-query#🚀 节点选择"
      - "https://8.8.8.8/dns-query#🚀 节点选择"

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [⚡ 延迟测速, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇰🇷 韩国节点, 📥 下载节点, 🚀 手动切换, 🐢 慢速节点, DIRECT]
  
  - name: ⚡ 延迟测速
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文|官网|剩余|到期|hk|港|hongkong)).*'
    proxies:
      - REJECT   # <--- 新增这一行占位符！
  # --- 核心业务分流 ---
  - name: 📹 油管视频
    type: select
    proxies: [🇯🇵 日本节点, 🚀 节点选择, ⚡ 延迟测速, 🇺🇲 美国节点, 📥 下载节点, 🇭🇰 香港节点] 
  - name: 💬 Ai平台
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择] # 专门负责 OpenAI 和 Gemini
  - name: 🇬 谷歌全家桶
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, ⚡ 延迟测速, 🚀 节点选择, 📥 下载节点] # 这里的 Google 流量不含 Gemini 了
  - name: 💬 Ai平台
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]
  - name: 📲 电报消息
    type: select
    proxies: [⚡ 延迟测速, 🚀 节点选择, 🇺🇲 美国节点, 🇯🇵 日本节点, 📥 下载节点, 🐢 慢速节点]
  - name: 💰 加密货币
    type: select
    proxies: [🇯🇵 日本节点, 🇺🇲 美国节点, 🚀 手动切换]
  - name: 🔞 成人内容
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择, 📥 下载节点, 🐢 慢速节点]
  - name: ☁️ 海外网盘
    type: select
    proxies: [📥 下载节点, 🐢 慢速节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]

  # --- 国内与特殊平台 ---
  - name: 📺 哔哩哔哩
    type: select
    proxies: [🎯 全球直连, 🇭🇰 香港节点]
  - name: 🎮 游戏平台
    type: select
    proxies: [DIRECT, 📥 下载节点, 🐢 慢速节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🚀 节点选择]
 - name: Ⓜ️ 微软服务
    type: select
    proxies: [DIRECT, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择, 📥 下载节点, 🐢 慢速节点]
  - name: 🍎 苹果服务
    type: select
    proxies: [DIRECT, 🚀 节点选择, 🇺🇲 美国节点, 🇯🇵 日本节点, 📥 下载节点, 🐢 慢速节点]
  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT]
  - name: 🚫 广告拦截
    type: select
    proxies: [REJECT, DIRECT]

  # --- 最终兜底组 ---
  - name: 🐟 漏网之鱼
    type: select
    proxies: [⚡ 延迟测速, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]

  # --- 地区与属性分类 (正则提取) ---
  - name: 📥 下载节点
    type: select
    include-all: true
    filter: '(?i)(wx|s801)'
  - name: 🇭🇰 香港节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(hk|港|hongkong)'
  - name: 🇯🇵 日本节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(jp|日本|tokyo|c93s4)'
  - name: 🇰🇷 韩国节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(kr|韩|seoul)'
  - name: 🇺🇲 美国节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文|c93s4|s801)).*(us|美|unitedstates|c93s|\.top-(?:VLESS_Reality_Vision|singbox_naive|anytls))'
  - name: 🐢 慢速节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    include-all: true
    filter: '(?i)(jgw|Oracle|甲骨文)'
    proxies:
      - REJECT  # 同样使用 REJECT 占位，防止转换器强行注入全量节点
  - name: 🚀 手动切换
    type: select
    include-all: true
    filter: '.*'
