port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: info

# =========================================
# 🌐 DNS 核心防御：双轨制全量加密
# =========================================
dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - '+.lan'
    - '+.local'
  nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query

  nameserver-policy:
    # 1. 国内及系统服务，走国内直连解析，保速度
    "geosite:cn,apple,microsoft":
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query

    # 2. 未知与海外域名，全部走隧道去海外加密解析，防泄漏
    "~": 
      - "https://1.1.1.1/dns-query#🚀 节点选择"
      - "https://8.8.8.8/dns-query#🚀 节点选择"

# =========================================
# 🚥 策略组 (Proxy Groups)
# =========================================
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [⚡ 延迟测速, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇰🇷 韩国节点, 📥 下载节点, 🚀 手动切换, 🐢 慢速节点, DIRECT]
  
  - name: ⚡ 延迟测速
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    include-all: true
    # 【纯净白名单】：只允许 搬瓦工、CN2、BuyVM、高端私有及 JMS 主干节点进入自动测速，彻底隔离脏 IP！
    filter: '(?i)(bwg|cn2|jpprou|jpsb3|jpzfvps2|buyvm|c93s[1-5])'
    proxies:
      - REJECT

  # --- 核心业务分流 ---
  - name: 📹 油管视频
    type: select
    proxies: [🇯🇵 日本节点, 🚀 节点选择, ⚡ 延迟测速, 🇺🇲 美国节点, 📥 下载节点, 🇭🇰 香港节点] 

  - name: 💬 Ai平台
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择] 

  - name: 🇬 谷歌全家桶
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, ⚡ 延迟测速, 🚀 节点选择, 📥 下载节点]

  - name: 📲 电报消息
    type: select
    proxies: [⚡ 延迟测速, 🚀 节点选择, 🇺🇲 美国节点, 🇯🇵 日本节点, 📥 下载节点, 🐢 慢速节点]

  - name: 💰 加密货币
    type: select
    proxies: [🇯🇵 日本节点, 🇺🇲 美国节点, 🚀 手动切换]

  - name: 🔞 成人内容
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择, 📥 下载节点, 🐢 慢速节点]

  - name: ☁️ 海外网盘
    type: select
    proxies: [📥 下载节点, 🐢 慢速节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]

  # --- 国内与特殊平台 ---
  - name: 📺 哔哩哔哩
    type: select
    proxies: [🎯 全球直连, 🇭🇰 香港节点]

  - name: 🎮 游戏平台
    type: select
    proxies: [DIRECT, 📥 下载节点, 🐢 慢速节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🚀 节点选择]

  - name: Ⓜ️ 微软服务
    type: select
    proxies: [DIRECT, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择, 📥 下载节点, 🐢 慢速节点]

  - name: 🍎 苹果服务
    type: select
    proxies: [DIRECT, 🚀 节点选择, 🇺🇲 美国节点, 🇯🇵 日本节点, 📥 下载节点, 🐢 慢速节点]

  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT]

  - name: 🚫 广告拦截
    type: select
    proxies: [REJECT, DIRECT]

  # --- 最终兜底组 ---
  - name: 🐟 漏网之鱼
    type: select
    # 既然有了 IP 探针，这里放心大胆地走代理，兜底未知海外流量
    proxies: [⚡ 延迟测速, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]

  # --- 地区与属性分类 (正则提取) ---
  - name: 📥 下载节点
    type: select
    include-all: true
    filter: '(?i)(wx|s801)'

  - name: 🇭🇰 香港节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(hk|港|hongkong)'

  - name: 🇯🇵 日本节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(jp|日本|tokyo|c93s4)'

  - name: 🇰🇷 韩国节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(kr|韩|seoul)'

  - name: 🇺🇲 美国节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文|c93s4|s801)).*(us|美|unitedstates|c93s|\.top-(?:VLESS_Reality_Vision|singbox_naive|anytls))'

  - name: 🐢 慢速节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    include-all: true
    filter: '(?i)(jgw|Oracle|甲骨文)'
    proxies:
      - REJECT

  - name: 🚀 手动切换
    type: select
    include-all: true
    filter: '.*'

# =========================================
# 🛡️ 终极 IP 探针兜底逻辑 (必须放在 YAML 最底部)
# =========================================
rules:
  # 1. 触发真实 IP 探测：遇到上面所有规则都不认识的域名，强制查真实 IP。
  # 查出是中国 IP，强行拉回直连！（完美解决闲鱼等国内冷门App乱跑问题）
  - GEOIP,CN,🎯 全球直连
  
  # 2. 终极漏网之鱼：如果不认识，且查出来的真实 IP 也是国外的，走代理！
  - MATCH,🐟 漏网之鱼
