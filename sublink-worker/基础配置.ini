port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: info
dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇰🇷 韩国节点, 📥 下载节点, 🚀 手动切换, 🐢 慢速节点, DIRECT]
  
  - name: ♻️ 自动选择
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文|官网|剩余|到期|hk|港|hongkong)).*'

  # --- 核心业务分流 ---
  - name: 🇬 谷歌全家桶
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, ♻️ 自动选择, 🚀 节点选择, 🇭🇰 香港节点]
  - name: 💬 Ai平台
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]
  - name: 📲 电报消息
    type: select
    proxies: [♻️ 自动选择, 🚀 节点选择, 🇺🇲 美国节点, 🇯🇵 日本节点]
  - name: 💰 加密货币
    type: select
    proxies: [🇯🇵 日本节点, 🇺🇲 美国节点, 🚀 手动切换]
  - name: 🔞 成人内容
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]
  - name: ☁️ 海外网盘
    type: select
    proxies: [📥 下载节点, 🚀 节点选择, 🐢 慢速节点]
  - name: 🌐 海外流量
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇭🇰 香港节点, 🐢 慢速节点]

  # --- 国内与特殊平台 ---
  - name: 📺 哔哩哔哩
    type: select
    proxies: [🎯 全球直连, 🇭🇰 香港节点]
  - name: 🎮 游戏平台
    type: select
    proxies: [DIRECT, 📥 下载节点, 🇯🇵 日本节点, 🚀 节点选择]
  - name: Ⓜ️ 微软与苹果
    type: select
    proxies: [DIRECT, 🇺🇲 美国节点, 🚀 节点选择]
  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT]
  - name: 🚫 广告拦截
    type: select
    proxies: [REJECT, DIRECT]
  - name: 🐟 漏网之鱼
    type: select
    proxies: [♻️ 自动选择, 🚀 节点选择, 🇺🇲 美国节点, 🇯🇵 日本节点]

  # --- 地区与属性分类 (保留原有正则) ---
  - name: 📥 下载节点
    type: select
    include-all: true
    filter: '(?i)(wx|s801)'
  - name: 🇭🇰 香港节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(hk|港|hongkong)'
  - name: 🇯🇵 日本节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(jp|日本|tokyo|c93s4)'
  - name: 🇰🇷 韩国节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(kr|韩|seoul)'
  - name: 🇺🇲 美国节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文|c93s4|s801)).*(us|美|unitedstates|c93s|\.top-(?:VLESS_Reality_Vision|singbox_naive|anytls))'
  - name: 🐢 慢速节点
    type: select
    include-all: true
    filter: '(?i)(jgw|Oracle|甲骨文)'
  - name: 🚀 手动切换
    type: select
    include-all: true
    filter: '.*'
