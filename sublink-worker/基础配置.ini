port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: info

# =========================================
# 🌐 DNS 核心防御：双轨制全量加密
# =========================================
dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - '+.lan'
    - '+.local'
  nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query

  nameserver-policy:
    # 1. 国内及系统服务，走国内直连解析，保下载速度
    "geosite:cn,apple,microsoft":
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query

    # 2. 未知与海外域名，全部走隧道去海外加密解析，防 DNS 污染
    "~": 
      - "https://1.1.1.1/dns-query#🚀 节点选择"
      - "https://8.8.8.8/dns-query#🚀 节点选择"

# =========================================
# 🚥 策略组 (Proxy Groups)
# =========================================
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [⚡ 延迟测速, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇰🇷 韩国节点, 📥 下载节点, 🚀 手动切换, 🐢 慢速节点, DIRECT]
  
  - name: ⚡ 延迟测速
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    include-all: true
    # 【纯净白名单】：只允许 搬瓦工、CN2、高端私有及 JMS 主干节点进入自动测速
    filter: '(?i)(bwg|cn2|jpprou|jpsb3|jpzfvps2|buyvm|c93s[1-5])'
    proxies:
      - REJECT

  - name: 📹 油管视频
    type: select
    proxies: [🇯🇵 日本节点, 🚀 节点选择, ⚡ 延迟测速, 🇺🇲 美国节点, 📥 下载节点, 🇭🇰 香港节点] 

  - name: 💬 Ai平台
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择] 

  - name: 🇬 谷歌全家桶
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, ⚡ 延迟测速, 🚀 节点选择, 📥 下载节点]

  - name: 📲 电报消息
    type: select
    proxies: [⚡ 延迟测速, 🚀 节点选择, 🇺🇲 美国节点, 🇯🇵 日本节点, 📥 下载节点, 🐢 慢速节点]

  - name: 💰 加密货币
    type: select
    proxies: [🇯🇵 日本节点, 🇺🇲 美国节点, 🚀 手动切换]

  - name: 🔞 成人内容
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择, 📥 下载节点, 🐢 慢速节点]

  - name: ☁️ 海外网盘
    type: select
    proxies: [📥 下载节点, 🐢 慢速节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]

  - name: 📺 哔哩哔哩
    type: select
    proxies: [🎯 全球直连, 🇭🇰 香港节点]

  - name: 🎮 游戏平台
    type: select
    proxies: [DIRECT, 📥 下载节点, 🐢 慢速节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🚀 节点选择]

  - name: Ⓜ️ 微软服务
    type: select
    proxies: [DIRECT, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择, 📥 下载节点, 🐢 慢速节点]

  - name: 🍎 苹果服务
    type: select
    proxies: [DIRECT, 🚀 节点选择, 🇺🇲 美国节点, 🇯🇵 日本节点, 📥 下载节点, 🐢 慢速节点]

  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT]

  - name: 🚫 广告拦截
    type: select
    proxies: [REJECT, DIRECT]

  - name: 🐟 漏网之鱼
    type: select
    proxies: [⚡ 延迟测速, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]

  - name: 📥 下载节点
    type: select
    include-all: true
    filter: '(?i)(wx|s801)'

  - name: 🇭🇰 香港节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(hk|港|hongkong)'

  - name: 🇯🇵 日本节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(jp|日本|tokyo|c93s4)'

  - name: 🇰🇷 韩国节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(kr|韩|seoul)'

  - name: 🇺🇲 美国节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文|c93s4|s801)).*(us|美|unitedstates|c93s|\.top-(?:VLESS_Reality_Vision|singbox_naive|anytls))'

  - name: 🐢 慢速节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    include-all: true
    filter: '(?i)(jgw|Oracle|甲骨文)'
    proxies: [REJECT]

  - name: 🚀 手动切换
    type: select
    include-all: true
    filter: '.*'

  - name: 🏠 私有网络
    type: select
    proxies: [DIRECT, 🚀 节点选择]

# =========================================
# 🛡️ 终极逻辑规则 (Rules)
# =========================================
rules:
  # --- 1. 高优先级：域名硬匹配 ---
  - DOMAIN-SUFFIX,gemini.google.com,💬 Ai平台
  - DOMAIN-SUFFIX,proactivebackend-pa.googleapis.com,💬 Ai平台
  - DOMAIN-SUFFIX,x.com,🚀 节点选择
  - DOMAIN-SUFFIX,twitter.com,🚀 节点选择
  - DOMAIN-KEYWORD,openai,💬 Ai平台
  - DOMAIN-KEYWORD,chatgpt,💬 Ai平台
  
  # --- 2. 规则集匹配 (Domain Rule Sets) ---
  - RULE-SET,category-ads-all,🚫 广告拦截
  - RULE-SET,openai,💬 Ai平台
  - RULE-SET,category-ai-!cn,💬 Ai平台
  - RULE-SET,bilibili,📺 哔哩哔哩
  - RULE-SET,apple,🍎 苹果服务
  - RULE-SET,microsoft,Ⓜ️ 微软服务
  - RULE-SET,google,🇬 谷歌全家桶
  - RULE-SET,youtube,📹 油管视频
  - RULE-SET,telegram,📲 电报消息
  - RULE-SET,gfw,🚀 节点选择
  - RULE-SET,geolocation-!cn,🚀 节点选择
  - RULE-SET,geolocation-cn,🎯 全球直连

  # --- 3. 终极防御：真实 IP 探测 (IP-Based Fallback) ---
  # 关键点：不加 no-resolve。如果是上面没认出来的域名，强行看 IP。
  - GEOIP,CN,🎯 全球直连
  - RULE-SET,private-ip,🏠 私有网络
  
  # --- 4. 终极兜底 ---
  - MATCH,🐟 漏网之鱼
