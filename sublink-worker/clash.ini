  - GEOSITE,mega,☁️ 海外网盘
  - GEOSITE,pikpak,☁️ 海外网盘
  - GEOSITE,terabox,☁️ 海外网盘
  - GEOSITE,usersdrive,☁️ 海外网盘
  - GEOSITE,onedrive,☁️ 海外网盘
  - GEOSITE,pstorage,☁️ 海外网盘
  # 2. 补充官方数据库未单独收录的知名海外网盘/文件托管
  - DOMAIN-SUFFIX,mediafire.com,☁️ 海外网盘
  - DOMAIN-SUFFIX,pcloud.com,☁️ 海外网盘
  - DOMAIN-SUFFIX,1fichier.com,☁️ 海外网盘
  - DOMAIN-SUFFIX,uptobox.com,☁️ 海外网盘
  - DOMAIN-SUFFIX,gofile.io,☁️ 海外网盘
  - DOMAIN-SUFFIX,catbox.moe,☁️ 海外网盘
  - DOMAIN-SUFFIX,filen.io,☁️ 海外网盘
  - DOMAIN-SUFFIX,sync.com,☁️ 海外网盘
  - DOMAIN-KEYWORD,rapidgator,☁️ 海外网盘

  # --- 常规大类与泛媒体 ---
  - GEOIP,telegram,📲 电报消息
  - GEOSITE,youtube,📹 油管视频
  - GEOSITE,bilibili,📺 哔哩哔哩
  - GEOSITE,apple,🍎 苹果服务
  - GEOSITE,microsoft,Ⓜ️ 微软服务
  - GEOSITE,geolocation-!cn,🌍 国外媒体
  - GEOSITE,geolocation-cn,🎯 全球直连
  - GEOIP,cn,🎯 全球直连
  - MATCH,🐟 漏网之鱼
