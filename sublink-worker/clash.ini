# ==============================================================
# 1. 官方基础网络配置 (保留优质 DNS 与 Fake-IP 加速)
# ==============================================================
port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: info
dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query

# ==============================================================
# 2. 策略组定义区 (Proxy Groups) - 完美防嵌套与慢速兜底逻辑
# ==============================================================
proxy-groups:
  # --- 🚀 核心选择组 (倒数第二位放置慢速节点) ---
  - name: 🚀 节点选择
    type: select
    proxies: [♻️ 自动选择, ⚖️ 负载均衡, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇰🇷 韩国节点, 📥 下载节点, 🚀 手动切换, 🐢 慢速节点, DIRECT]

  # --- ♻️ 自动选择 & ⚖️ 负载均衡 (利用 filter 正则剔除特定节点) ---
  - name: ♻️ 自动选择
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文|官网|剩余|到期|hk|港|hongkong)).*'
  
  - name: ⚖️ 负载均衡
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文|hk|港|hongkong)).*'

  # --- 核心专属业务 ---
  - name: 💰 加密货币
    type: select
    proxies: [🇯🇵 日本节点, 🇺🇲 美国节点, 🚀 手动切换]
  - name: 💬 Ai平台
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, 🐢 慢速节点]
  - name: 🔞 成人内容
    type: select
    proxies: [🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择, 🐢 慢速节点]
  - name: ☁️ 海外网盘
    type: select
    proxies: [📥 下载节点, 🚀 节点选择, 🐢 慢速节点]
  - name: 📺 哔哩哔哩
    type: select
    proxies: [🎯 全球直连, 🇭🇰 香港节点, 📥 下载节点]
  - name: 📹 油管视频
    type: select
    proxies: [♻️ 自动选择, 🚀 节点选择, 🇯🇵 日本节点, 🇭🇰 香港节点, 🇺🇲 美国节点, 📥 下载节点, 🐢 慢速节点]
  - name: 📲 电报消息
    type: select
    proxies: [♻️ 自动选择, 🚀 节点选择, 📥 下载节点, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🐢 慢速节点]
  - name: 🌍 国外媒体
    type: select
    proxies: [🚀 节点选择, 📥 下载节点, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🐢 慢速节点]
  - name: 🎮 游戏平台
    type: select
    proxies: [DIRECT, 📥 下载节点, 🐢 慢速节点, 🇯🇵 日本节点, 🚀 节点选择]

  # --- 基础设施 (防微软苹果互相嵌套死循环) ---
  - name: 📢 谷歌FCM
    type: select
    proxies: [♻️ 自动选择, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]
  - name: Ⓜ️ 微软Bing
    type: select
    proxies: [♻️ 自动选择, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]
  - name: Ⓜ️ 微软服务
    type: select
    proxies: [DIRECT, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]
  - name: 🍎 苹果服务
    type: select
    proxies: [DIRECT, 🇺🇲 美国节点, 🇯🇵 日本节点, 🚀 节点选择]

  # --- 拦截与直连 ---
  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT]
  - name: 🚫 广告拦截
    type: select
    proxies: [REJECT, DIRECT]
  - name: 🐟 漏网之鱼
    type: select
    proxies: [⚖️ 负载均衡, ♻️ 自动选择, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇰🇷 韩国节点]

  # ==============================================================
  # 3. 正则筛选器 (使用 include-all: true 解决抓取空节点报错)
  # ==============================================================
  - name: 📥 下载节点
    type: select
    include-all: true
    filter: '(?i)(wx|s801)'
  - name: 🇭🇰 香港节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(hk|港|hongkong)'
  - name: 🇯🇵 日本节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(jp|日本|tokyo|c93s4)'
  - name: 🇰🇷 韩国节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文)).*(kr|韩|seoul)'
  - name: 🇺🇲 美国节点
    type: select
    include-all: true
    filter: '(?i)^(?!.*(jgw|Oracle|甲骨文|c93s4|s801)).*(us|美|unitedstates|c93s|\.top-(?:VLESS_Reality_Vision|singbox_naive|anytls))'
  - name: 🐢 慢速节点
    type: select
    include-all: true
    filter: '(?i)(jgw|Oracle|甲骨文)'
  - name: 🚀 手动切换
    type: select
    include-all: true
    filter: '.*'

# ==============================================================
# 4. 路由规则 (包含极简去重优化版 & 海外网盘终极补全)
# ==============================================================
rules:
  # --- 拦截 ---
  - GEOSITE,category-ads-all,🚫 广告拦截
  
  # --- 核心专属业务 ---
  - GEOSITE,category-cryptocurrency,💰 加密货币
  - GEOSITE,category-ai-!cn,💬 Ai平台
  
  # 🔞 终极总表 (已包含 9万+ 域名及所有知名分站)
  - GEOSITE,category-porn,🔞 成人内容
  # 防止极个别不在官方总表里的新站漏网
  - DOMAIN-KEYWORD,hanime1,🔞 成人内容
  - DOMAIN-KEYWORD,bika,🔞 成人内容
  
  # --- ☁️ 海外网盘 (终极满血补全版) ---
  # 1. 官方 GEOSITE 数据库已有的独立网盘
