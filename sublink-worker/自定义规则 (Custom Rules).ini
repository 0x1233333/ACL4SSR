网页上找到 【自定义规则 (Custom Rules)】 区域，切换到 JSON 视图。
将以下代码完整粘贴进去。这套规则使用了最高优先级的关键字匹配，并调取了全量数据库，完美补全了所有海外分享盘和独立成人站点：

