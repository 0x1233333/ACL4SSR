# mihomo-template-ipv6-safe-fixed.yaml
# 生成目标：订阅转换模板；IPv6 保持开启，同时修复 DNS 套娃、直连组污染、管理接口暴露与 IPv6 真实地址误分流风险。
# 节点来源：由订阅转换后自动注入，本模板不内置 proxies/proxy-providers。
# 设计原则：
# 1. 顶层 ipv6=true，dns.ipv6=true，允许 IPv6 节点和 AAAA 解析。
# 2. DNS 查询不再依赖 🚀 节点选择，国外 DoH 走独立 🧭 DNS出口，避免启动/测速/解析套娃。
# 3. 🎯 全球直连固定为 DIRECT，避免 CN/private 流量被手动切到代理。
# 4. 不使用 IP-CIDR6,::/0 暴力兜底；仅保护 IPv6 私网/链路本地直连，并把公网 IPv6 交给漏网组。
# 5. DNS 传输仍以 IPv4 DNS/DoH 为主，可返回 AAAA；这样比“DNS 也强制 IPv6 传输”更稳。
# 注意：如果旁路由/TUN 没有接管 IPv6，任何配置都不能完全防止客户端 IPv6 裸连；需要确认 Nikki/Mihomo 的 IPv6 TUN/透明代理已开启。

