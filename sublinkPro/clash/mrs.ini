dns:
  enable: true
  listen: :1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 👇 核心解决模块：Fake-IP 过滤器
  fake-ip-filter:
    - "geosite:cn"                 # 遇到国内域名，不返回假 IP
    - "*.lan"                      # 局域网相关域名不返回假 IP
    - "*.localdomain"
    - "*.localhost"
    - "*.local"
    - "*.home.arpa"
    - "localhost.ptlogin2.qq.com"  # 修复 QQ 扫码登录报错
  # 国内直连 DNS
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 国外代理/防污染 DNS
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

