rules:
  # 🌟 修改 4：拦截 Google 的 UDP 443 (QUIC) 流量，强制回落到 TCP 访问，解决协议漂移问题
  - AND,((DST-PORT,443),(NETWORK,UDP),(RULE-SET,google)),REJECT
  - AND,((DST-PORT,443),(NETWORK,UDP),(DOMAIN-SUFFIX,google.com)),REJECT
  
  - RULE-SET,ads,🚫 广告拦截
  
  - RULE-SET,openai,💬 Ai平台
  - RULE-SET,gemini,💬 Ai平台
  - RULE-SET,claude,💬 Ai平台
  - RULE-SET,anthropic,💬 Ai平台
  - RULE-SET,copilot,💬 Ai平台
  - RULE-SET,porn,🔞 成人内容
  - RULE-SET,crypto,💰 加密货币

  - RULE-SET,github,🚀 节点选择      
  - RULE-SET,bing,Ⓜ️ 微软Bing        
  - RULE-SET,youtube,📹 油管视频     
  
  - RULE-SET,bilibili,📺 哔哩哔哩
  - RULE-SET,apple,🍎 苹果服务
  - RULE-SET,microsoft,Ⓜ️ 微软服务
  - RULE-SET,games,🎮 游戏平台
  - RULE-SET,download,📥 下载节点
  - RULE-SET,pikpak,☁️ PikPak
  
  - RULE-SET,telegram,📲 电报消息
  - RULE-SET,telegram_ip,📲 电报消息  
  - RULE-SET,twitter,🚀 节点选择
  - RULE-SET,google,📢 谷歌服务
  - RULE-SET,google_ip,📢 谷歌服务    
  - RULE-SET,globalmedia,🌍 非国内
  
  - RULE-SET,cn_domain,🎯 全球直连
  - RULE-SET,cn_ip,🎯 全球直连
  
  - MATCH,🐟 漏网之鱼
