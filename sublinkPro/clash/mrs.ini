  - name: "Ⓜ️ 微软Bing"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🚀 节点选择"
      - "🇺🇲 美国节点"
      - "🇯🇵 日本节点"
      - "🚀 手动切换"

  - name: "Ⓜ️ 微软服务"
    type: select
    proxies:
      - DIRECT
      - "🇺🇲 美国节点"
      - "🇯🇵 日本节点"
      - "🚀 节点选择"

  - name: "🍎 苹果服务"
    type: select
    proxies:
      - DIRECT
      - "🇺🇲 美国节点"
      - "🇯🇵 日本节点"
      - "🚀 节点选择"

  - name: "🎯 全球直连"
    type: select
    proxies:
      - DIRECT

  - name: "🚫 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🇯🇵 日本节点"
      - "🇰🇷 韩国节点"

  - name: "📥 下载节点"
    type: select
    include-all: true
    filter: '(?i)(wx|s801)'

  - name: "🇭🇰 香港节点"
    type: select
    include-all: true
    filter: '(?i)hk|港|hongkong'
    exclude-filter: '(?i)jgw|Oracle|甲骨文'

  - name: "🇯🇵 日本节点"
    type: select
    include-all: true
    filter: '(?i)jp|日本|tokyo|c93s4'
    exclude-filter: '(?i)jgw|Oracle|甲骨文'

  - name: "🇰🇷 韩国节点"
    type: select
    include-all: true
    filter: '(?i)kr|韩|seoul'
    exclude-filter: '(?i)jgw|Oracle|甲骨文'

  - name: "🇺🇲 美国节点"
    type: select
    include-all: true
    filter: '(?i)us|美|unitedstates|c93s|\.top-(?:VLESS_Reality_Vision|singbox_naive|anytls)'
    exclude-filter: '(?i)jgw|Oracle|甲骨文|c93s4|s801'

  - name: "🐢 慢速节点"
    type: select
    include-all: true
    filter: '(?i)(jgw|Oracle|甲骨文)'

  - name: "🚀 手动切换"
    type: select
    include-all: true

