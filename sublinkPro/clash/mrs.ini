rules:
  # 🚀 [已修复] 阻断 QUIC/UDP，强制回退 TCP，解决 Gemini/Google 加载转圈卡顿问题
  - "AND,((DST-PORT,443),(NETWORK,UDP),(RULE-SET,google)),REJECT-DROP"
  - "AND,((DST-PORT,443),(NETWORK,UDP),(RULE-SET,gemini)),REJECT-DROP"
  - "AND,((DST-PORT,443),(NETWORK,UDP),(DOMAIN-SUFFIX,google.com)),REJECT-DROP"
  
  # 👇 强行置顶 Gemini 域名规则，避免其被泛 Google 规则拦截掉
  - "DOMAIN-SUFFIX,gemini.google.com,💬 Ai平台"
  - "DOMAIN-SUFFIX,generativelanguage.googleapis.com,💬 Ai平台"
  - "DOMAIN-KEYWORD,gemini,💬 Ai平台"

  - "RULE-SET,ads,🚫 广告拦截"
  
  - "RULE-SET,openai,💬 Ai平台"
  - "RULE-SET,gemini,💬 Ai平台"
