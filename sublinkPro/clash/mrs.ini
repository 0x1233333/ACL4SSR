port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

geox-url:
  geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
geo-auto-update: true
geo-update-interval: 24

dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  ipv6: true
  listen: "[::]:1053"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: "fdfe:dcba:9876::1/64"
  fake-ip-filter-mode: blacklist
  respect-rules: true
  use-hosts: true
  use-system-hosts: true

  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.home.arpa"
    - "localhost"
    - "localhost.*"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "www.msftconnecttest.com"
    - "www.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "time-ios.apple.com"
    - "time1.cloud.tencent.com"
    - "ntp.*.com"
    - "ntp.*.com.cn"
    - "pool.ntp.org"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
    - "xbox.*.microsoft.com"
    - "+.router.asus.com"
    - "+.miwifi.com"
    - "+.tplogin.cn"
    - "+.zte.home"

  # 只用于解析 DoH 服务器本身：普通 IP DNS，国内两家，IPv4/IPv6 各一个。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - "2400:3200::1"
    - "2402:4e00::"

  # 默认基底：国外加密 DNS。国内域名由 nameserver-policy 精确回国内 DNS。
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query

  # 直连域名使用国内加密 DNS。
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true

  # 代理节点域名使用国内加密 DNS，避免节点域名解析慢或解析到不合适线路。
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  nameserver-policy:
    "geosite:private,cn,apple-cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

proxies: []

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🚀 手动切换"
      - "DIRECT"

  - name: "🚀 手动切换"
    type: select
    proxies:
      - __ALL_PROXIES__

  - name: "♻️ 自动选择"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - __ALL_PROXIES__

  - name: "🎯 全球直连"
