proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇺🇲 美国节点"
      - "🇰🇷 韩国节点"
      - "📥 下载节点"
      - "🚀 手动切换"
      - "🐢 慢速节点"
      - "DIRECT"

  - name: "♻️ 自动选择"
    type: url-test
    url: "http://cp.cloudflare.com/generate_204"
    interval: 600
    tolerance: 50
    include-all: true
    exclude-filter: "(?i)jgw|Oracle|甲骨文|官网|剩余|到期|hk|港|hongkong"

  - name: "💰 加密货币"
    type: select
    proxies:
      - "🇯🇵 日本节点"
      - "🇺🇲 美国节点"
      - "🚀 手动切换"

  # 🌟 修改 1：移除了慢速节点，保证 AI 服务的纯净
  - name: "💬 Ai平台"
    type: select
    proxies:
      - "🤖 AI解锁"
      - "🇺🇲 美国节点"
      - "🇯🇵 日本节点"
      - "🇰🇷 韩国节点"

  - name: "🔞 成人内容"
    type: select
    proxies:
      - "🇺🇲 美国节点"
      - "🇯🇵 日本节点"
      - "🚀 节点选择"
      - "🐢 慢速节点"

  - name: "☁️ PikPak"
    type: select
    proxies:
      - "📥 下载节点"
      - "🚀 节点选择"
      - "🐢 慢速节点"

  - name: "📺 哔哩哔哩"
    type: select
    proxies:
      - "🎯 全球直连"
      - "🇭🇰 香港节点"
      - "📥 下载节点"

  - name: "📹 油管视频"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🚀 节点选择"
      - "🇯🇵 日本节点"
      - "🇭🇰 香港节点"
      - "🇺🇲 美国节点"
      - "📥 下载节点"
      - "🐢 慢速节点"

  - name: "📲 电报消息"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🚀 节点选择"
      - "📥 下载节点"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇺🇲 美国节点"
      - "🇰🇷 韩国节点"
      - "🚀 手动切换"
      - "🐢 慢速节点"

  - name: "🎮 游戏平台"
    type: select
    proxies:
      - "DIRECT"
      - "🇯🇵 日本节点"
      - "🇰🇷 韩国节点"
      - "🚀 节点选择"
      - "📥 下载节点"
      - "🐢 慢速节点"

  # 🌟 修改 2：谷歌服务首选指向“💬 Ai平台”，强制与 Gemini 使用同一个 IP 避免重定向死循环
  - name: "📢 谷歌服务"
    type: select
    proxies:
      - "💬 Ai平台"
      - "🤖 AI解锁"
      - "♻️ 自动选择"
      - "🚀 节点选择"
      - "🇺🇲 美国节点"
      - "🇯🇵 日本节点"
      - "🚀 手动切换"

  - name: "Ⓜ️ 微软Bing"
    type: select
    proxies:
      - "🤖 AI解锁"
      - "♻️ 自动选择"
      - "🚀 节点选择"
      - "🇺🇲 美国节点"
      - "🇯🇵 日本节点"
      - "🚀 手动切换"

  - name: "Ⓜ️ 微软服务"
    type: select
    proxies:
      - "DIRECT"
      - "🤖 AI解锁"
      - "🇺🇲 美国节点"
      - "🇯🇵 日本节点"
      - "🚀 节点选择"

  - name: "🍎 苹果服务"
    type: select
    proxies:
      - "DIRECT"
      - "🤖 AI解锁"
      - "🇺🇲 美国节点"
      - "🇯🇵 日本节点"
      - "🚀 节点选择"

  - name: "🌍 非国内"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🤖 AI解锁"
      - "📥 下载节点"
      - "♻️ 自动选择"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇺🇲 美国节点"
      - "🇰🇷 韩国节点"
      - "🚀 手动切换"
      - "🐢 慢速节点"

  - name: "🎯 全球直连"
    type: select
    proxies:
      - "DIRECT"

  - name: "🚫 广告拦截"
    type: select
    proxies:
      - "REJECT"
      - "DIRECT"

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🤖 AI解锁"
      - "♻️ 自动选择"
      - "🇺🇲 美国节点"
      - "🚀 节点选择"
      - "🇯🇵 日本节点"
      - "🇰🇷 韩国节点"

  # ================= 底层节点池（区域与特定功能） =================
  - name: "📥 下载节点"
    type: select
    include-all: true
    filter: "(?i)(wx|s801)"

  - name: "🇭🇰 香港节点"
    type: url-test
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)hk|港|hongkong"
    exclude-filter: "(?i)jgw|Oracle|甲骨文"

  - name: "🇯🇵 日本节点"
    type: url-test
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)jp|日本|tokyo|c93s4"
    exclude-filter: "(?i)jgw|Oracle|甲骨文"

  - name: "🇰🇷 韩国节点"
    type: url-test
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)kr|韩|seoul"
    exclude-filter: "(?i)jgw|Oracle|甲骨文"

  - name: "🇺🇲 美国节点"
    type: url-test
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)us|美|unitedstates|c93s|\\.top-(?:VLESS_Reality_Vision|singbox_naive|anytls)"
    exclude-filter: "(?i)jgw|Oracle|甲骨文|c93s4|s801"

  # 🌟 修改 3：严格排除了香港，并加入了新加坡/台湾这些原生支持 AI 的节点地区
  - name: "🤖 AI解锁"
    type: select
    include-all: true
    filter: "(?i)us|美|unitedstates|jp|日本|tokyo|sg|新|singapore|tw|台|taiwan"
    exclude-filter: "(?i)hk|港|hongkong|jgw|Oracle|甲骨文"

  - name: "🐢 慢速节点"
    type: select
    include-all: true
    filter: "(?i)(jgw|Oracle|甲骨文)"

  - name: "🚀 手动切换"
    type: select
    include-all: true

